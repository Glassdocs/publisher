# ═══════════════════════════════════════════════════════════════════════
# Reusable secure-by-default Markdown publisher (Zensical)
#
# A Glassdocs KB is Markdown, full stop: docs/*.md + mkdocs.yml, no custom
# HTML. This workflow builds that source with Zensical (the MkDocs successor
# from the Material team, which reads the KB's mkdocs.yml) and publishes the
# built site to Cloudflare Pages, secure by default:
#   1. A Cloudflare Access app + allow policy exist (fail-closed if none match)
#   2. Site is NOT publicly accessible before deploy (pre-flight)
#   3. Built site deploys to Cloudflare Pages
#   4. On first deploy, the Access app is created right after the project exists
#   5. Site is NOT publicly accessible after deploy (post-deploy)
#   6. If the post-deploy check fails, the deployment is rolled back (deleted)
#
# Usage in a consumer KB repo (.github/workflows/deploy.yml):
#   jobs:
#     deploy:
#       if: vars.CF_PAGES_PROJECT != ''
#       permissions:
#         contents: read
#         deployments: write
#       uses: Glassdocs/publisher/.github/workflows/deploy-pages.yml@v1
#       with:
#         project-name: ${{ vars.CF_PAGES_PROJECT }}
#       secrets: inherit
# ═══════════════════════════════════════════════════════════════════════

name: Docs Deploy (reusable)

on:
  workflow_call:
    inputs:
      project-name:
        description: "Cloudflare Pages project name (becomes <project-name>.pages.dev)"
        required: true
        type: string
      email-domain:
        description: "Staff email domain for the allow policy (e.g. acme.com). Empty (default) = NO domain-level access; grant specific people via allowed-emails / client-emails. Fail-closed: a KB with no access inputs deploys locked."
        required: false
        type: string
        default: ""
      allowed-emails:
        description: "Comma-separated email addresses to allow. If email-domain is empty, ONLY these emails get access."
        required: false
        type: string
        default: ""
      client-emails:
        description: "Comma-separated client email addresses to allow on this KB (in addition to the staff email-domain, if any)"
        required: false
        type: string
        default: ""
      client-domain:
        description: "A single client email domain to allow on this KB (in addition to the staff email-domain, if any)"
        required: false
        type: string
        default: ""
      allow-financial:
        description: "Allow financial/contractual content in docs/ (only for pre-sales KBs)"
        required: false
        type: boolean
        default: false
      skip-lint:
        description: "Skip the compliance lint step (not recommended)"
        required: false
        type: boolean
        default: false
      python-version:
        description: "Python version used to build the site"
        required: false
        type: string
        default: "3.12"
      wrangler-version:
        description: "Pin a specific Wrangler version (leave empty for latest)"
        required: false
        type: string
        default: ""
      source-repo:
        description: "MANAGED hosting: owner/name of the KB repo to build. Empty (default) = build the calling repo (client-hosted). When set, SOURCE_TOKEN must grant read access."
        required: false
        type: string
        default: ""
      source-ref:
        description: "Git ref to build for source-repo (default: its default branch). Ignored when source-repo is empty."
        required: false
        type: string
        default: ""
    # Declared so callers in ANOTHER organization can pass them explicitly —
    # `secrets: inherit` only forwards within the same org/enterprise, so a
    # cross-org caller (a customer repo calling Glassdocs/publisher) MUST map
    # these by name. Optional so a not-yet-connected repo still runs and hits
    # the credential preflight with a clear message instead of a hard gate.
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: "Cloudflare API token (Pages:Edit + Access: Apps and Policies:Edit)"
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        description: "Cloudflare account id that owns the Pages project"
        required: false
      SOURCE_TOKEN:
        description: "MANAGED hosting: a token that can read source-repo (e.g. a Glassdocs App installation token). Unused for the client-hosted path."
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      PROJECT_NAME: ${{ inputs.project-name }}
      # The built site is always published from ./site (Zensical's default
      # output dir, the same one mkdocs used).
      SITE_DIR: site
    steps:
      # SECURITY: fail closed on a malformed project name before it reaches any
      # wrangler `command:` or Cloudflare API JSON body. Pages project names are
      # [a-z0-9-]; rejecting anything else stops argument/JSON injection when the
      # name is supplied directly as a repo variable (self-host) rather than via
      # the server's already-validated setup path.
      - name: Validate project name
        run: |
          case "$PROJECT_NAME" in
            ""|*[!a-z0-9-]*)
              echo "::error::Invalid Cloudflare Pages project name '$PROJECT_NAME' — only lowercase letters, digits, and hyphens are allowed."
              exit 1 ;;
          esac

      # Check out the KB source. Client-hosted (default): the caller's own repo.
      # Managed: the Glassdocs builder sets source-repo + SOURCE_TOKEN so we build
      # the customer's repo from the Glassdocs org.
      - name: Check out KB source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source-repo != '' && inputs.source-repo || github.repository }}
          ref: ${{ inputs.source-repo != '' && inputs.source-ref || github.ref }}
          token: ${{ inputs.source-repo != '' && secrets.SOURCE_TOKEN || github.token }}

      # Glassdocs is public, so the shared-asset fetch needs no auth. We only
      # need the security-headers template (_headers) and the compliance lint;
      # everything visual now comes from the KB's own mkdocs.yml + docs/.
      - name: Fetch Glassdocs platform files
        uses: actions/checkout@v4
        with:
          repository: Glassdocs/publisher
          ref: v1
          path: _playbook
          sparse-checkout: |
            templates/_headers
            templates/search/scripts/docs-lint.sh
            templates/search/scripts/inject-source-meta.mjs

      # Compliance lint on the Markdown source — fails the deploy on violations
      # BEFORE any side effects. Markdown-only rules: a deploy workflow exists,
      # no custom HTML is tracked, no commercial content unless allow-financial.
      - name: Run docs compliance lint
        if: ${{ !inputs.skip-lint }}
        env:
          DOCS_DIR: docs
          ALLOW_FINANCIAL: ${{ inputs.allow-financial }}
        run: |
          set -uo pipefail
          out=$(bash _playbook/templates/search/scripts/docs-lint.sh) || rc=$?
          rc=${rc:-0}
          echo "$out" | while IFS= read -r line; do
            case "$line" in
              FAIL:*) echo "::error::${line#FAIL: }" ;;
              WARN:*) echo "::warning::${line#WARN: }" ;;
              *)      echo "$line" ;;
            esac
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error::Docs lint failed. See https://github.com/Glassdocs/glassdocs for playbook rules. Deploy blocked."
            exit "$rc"
          fi

      # setup-python's pip cache keys on a requirements/pyproject file and HARD
      # FAILS if none exists — which is exactly a minimal Markdown KB (mkdocs.yml
      # + docs/, no Python deps). Materialize the Zensical baseline so the cache
      # always has a key and builds are reproducible. A repo that ships its own
      # requirements.txt / docs/requirements.txt / pyproject.toml is left
      # untouched and still wins in the install step below.
      - name: Ensure a pip dependency file exists
        run: |
          set -euo pipefail
          if [ ! -f requirements.txt ] && [ ! -f docs/requirements.txt ] && [ ! -f pyproject.toml ]; then
            echo "zensical" > requirements.txt
            echo "No pip dependency file in the KB — wrote a baseline requirements.txt (zensical)."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      # Zensical reads the KB's mkdocs.yml unchanged. A KB may pin Zensical (or
      # extra plugins) via requirements.txt or docs/requirements.txt; if it ships
      # neither, install Zensical directly. Mirrors docs-playbook's Zensical build.
      - name: Install site generator
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            echo "Installing requirements.txt"
            pip install -r requirements.txt
          elif [ -f docs/requirements.txt ]; then
            echo "Installing docs/requirements.txt"
            pip install -r docs/requirements.txt
          else
            echo "No requirements file — installing zensical directly"
            pip install zensical
          fi

      - name: Build site
        run: |
          set -euo pipefail
          if [ ! -f mkdocs.yml ]; then
            echo "::error::No mkdocs.yml at repo root. A Glassdocs KB is Markdown: docs/*.md + mkdocs.yml."
            exit 1
          fi
          zensical build

      # Inject GlassDocs recognition meta (source-repo / source-path) into the
      # built HTML so the browser extension recognises this site and maps each
      # page to its Markdown source. Post-build + build-agnostic on purpose:
      # Zensical rewrote theming, so mkdocs-material template overrides are a
      # no-op — the repo identity is a deploy-time fact, injected here where CI
      # actually knows it. Non-fatal if the repo can't be determined.
      - name: Inject GlassDocs recognition meta
        env:
          # Env-indirection, NOT `${{ }}` inlined into the script line: source-repo
          # is an unvalidated workflow_call input, and bash re-evaluates inlined
          # interpolation, so inlining it would allow shell injection on the runner
          # that later holds SOURCE_TOKEN + the Cloudflare token. Passed as $REPO,
          # the value is data, never code. (The injector also validates the format
          # and bails safely if it isn't OWNER/NAME.)
          REPO: ${{ inputs.source-repo != '' && inputs.source-repo || github.repository }}
        run: |
          node _playbook/templates/search/scripts/inject-source-meta.mjs \
            --repo "$REPO" \
            --site "$SITE_DIR" --docs-dir docs

      # _headers (security headers + CSP) is a Cloudflare Pages control file and
      # must sit at the site root. It ALWAYS comes from the platform template —
      # security posture is not a per-KB choice.
      - name: Add security headers
        run: cp _playbook/templates/_headers "$SITE_DIR/_headers"

      # ── 0. Cloudflare credential preflight ──
      # Report exactly what arrived so an empty/short secret is diagnosable at a
      # glance (the API otherwise fails with a cryptic "could not route" when the
      # account id is blank). Token is masked by Actions; we print only its
      # length. The account id is not a secret, so we verify + echo it, and
      # confirm the token can actually reach the account before doing anything.
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          echo "CLOUDFLARE_API_TOKEN:  present=${CLOUDFLARE_API_TOKEN:+yes}${CLOUDFLARE_API_TOKEN:-NO}  length=${#CLOUDFLARE_API_TOKEN}"
          echo "CLOUDFLARE_ACCOUNT_ID: present=${CLOUDFLARE_ACCOUNT_ID:+yes}${CLOUDFLARE_ACCOUNT_ID:-NO}  length=${#CLOUDFLARE_ACCOUNT_ID}  value='${CLOUDFLARE_ACCOUNT_ID}'"
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Cloudflare credentials are empty in this run. The KB repo needs CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID as Actions **secrets** (use 'Connect Cloudflare' in the Glassdocs admin, or set them on the repo). If they ARE set on the repo but still arrive empty here, the reusable workflow isn't inheriting them — check that the caller passes 'secrets: inherit'."
            exit 1
          fi
          # Prove the token reaches the account (verify + Access scope) up front.
          VER=$(curl -s -o /dev/null -w "%{http_code}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          ACC=$(curl -s -o /dev/null -w "%{http_code}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/access/apps?per_page=1" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          echo "token verify → ${VER}   access/apps → ${ACC}   (both 200 expected)"
          if [ "${ACC}" != "200" ]; then
            echo "::error::The Cloudflare token can't reach Access on account ${CLOUDFLARE_ACCOUNT_ID} (HTTP ${ACC}). It needs 'Access: Apps and Policies: Edit'. Re-create it from the Glassdocs deep link."
            exit 1
          fi

      # ── 1. Ensure Cloudflare Access app exists ──
      # On first deploy the Pages project doesn't exist yet, so Access app
      # creation will fail. We record that and create it after deploy instead.
      - name: Ensure Cloudflare Access app
        id: access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Derive the Access domain from the project's ACTUAL subdomain, not the
          # project name. On a GLOBAL pages.dev name collision Cloudflare assigns a
          # suffixed subdomain (e.g. <name>-xyz.pages.dev); protecting <name>.pages.dev
          # would target a domain owned by a DIFFERENT account and fail forever with
          # Access error 12130 "domain does not belong to zone". Query the real
          # subdomain when the project exists; fall back to the name-based domain only
          # on a true first deploy (project not created yet).
          PROJ_JSON=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          DOMAIN=$(printf '%s' "$PROJ_JSON" | jq -r '.result.subdomain // empty')
          if [ -z "$DOMAIN" ]; then
            DOMAIN="${PROJECT_NAME}.pages.dev"
            echo "Project not created yet — using name-based domain ${DOMAIN} for now."
          elif [ "$DOMAIN" != "${PROJECT_NAME}.pages.dev" ]; then
            echo "::warning::pages.dev name collision: this project's real domain is ${DOMAIN}, not ${PROJECT_NAME}.pages.dev (the plain name is taken by another Cloudflare account). Protecting the real domain. To get the clean URL, delete this Pages project and redeploy once the plain name is free."
          fi
          BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/access"

          echo "Access domain resolved to ${DOMAIN}"
          echo "domain=${DOMAIN}" >> "$GITHUB_OUTPUT"

          # Find existing Access app (paginate through all pages)
          APP_ID=""
          PAGE=1
          while true; do
            LIST_RESPONSE=$(curl -s "${BASE}/apps?page=${PAGE}&per_page=50" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
            LIST_SUCCESS=$(echo "$LIST_RESPONSE" | jq -r '.success // false')
            if [ "$LIST_SUCCESS" != "true" ]; then
              echo "::error::Failed to list Access apps: $(echo "$LIST_RESPONSE" | jq -r '.errors[0].message // "unknown"')"
              echo "$LIST_RESPONSE" >&2
              exit 1
            fi
            MATCH=$(echo "$LIST_RESPONSE" | \
              jq -r --arg d "$DOMAIN" \
                '(.result // [])[] | select(.self_hosted_domains[]? == $d or .domain == $d) | .id' | head -1)
            if [ -n "$MATCH" ]; then
              APP_ID="$MATCH"
              break
            fi
            COUNT=$(echo "$LIST_RESPONSE" | jq -r '(.result // []) | length')
            TOTAL_PAGES=$(echo "$LIST_RESPONSE" | jq -r '.result_info.total_pages // 1')
            echo "Page ${PAGE}/${TOTAL_PAGES}: ${COUNT} apps, no match for ${DOMAIN}"
            if [ "$PAGE" -ge "$TOTAL_PAGES" ] || [ "$COUNT" = "0" ]; then
              break
            fi
            PAGE=$((PAGE + 1))
          done

          if [ -n "$APP_ID" ]; then
            echo "Found existing Access app: $APP_ID"
            echo "app_id=${APP_ID}" >> "$GITHUB_OUTPUT"
            echo "access_ready=true" >> "$GITHUB_OUTPUT"
          else
            # Try to create — will fail on first deploy (Pages project doesn't exist yet)
            CREATE_RESPONSE=$(curl -s -X POST "${BASE}/apps" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{
                \"name\":\"${PROJECT_NAME}\",
                \"domain\":\"${DOMAIN}\",
                \"type\":\"self_hosted\",
                \"session_duration\":\"24h\"
              }")
            APP_ID=$(echo "$CREATE_RESPONSE" | jq -r '.result.id // empty')

            if [ -n "$APP_ID" ]; then
              echo "Created Access app: $APP_ID"
              echo "app_id=${APP_ID}" >> "$GITHUB_OUTPUT"
              echo "access_ready=true" >> "$GITHUB_OUTPUT"
            else
              ERROR=$(echo "$CREATE_RESPONSE" | jq -r '.errors[0].message // "unknown"')
              if echo "$ERROR" | grep -qE "domain does not belong to zone|internal_server_error"; then
                echo "::warning::Pages project does not exist yet — Access app will be created after first deploy."
                echo "access_ready=false" >> "$GITHUB_OUTPUT"
              else
                echo "::error::Failed to create Access app: $ERROR"
                echo "$CREATE_RESPONSE" >&2; exit 1
              fi
            fi
          fi

      # ── 1b. Merge allowed-emails + client-emails ──
      - name: Merge email lists
        id: emails
        # SECURITY: the email inputs are attacker-influenceable (admin-supplied,
        # or set directly as CLIENT_EMAILS by anyone with repo write). They reach
        # the shell ONLY through env vars — never inlined as ${{ }} in run: —
        # because bash does not re-evaluate a variable's contents, so a crafted
        # value like `x@e.com"; curl evil #` cannot inject commands into this
        # runner (which later holds the Cloudflare API token).
        env:
          ALLOWED_EMAILS: ${{ inputs.allowed-emails }}
          CLIENT_EMAILS: ${{ inputs.client-emails }}
        run: |
          ALL="$ALLOWED_EMAILS"
          [ -n "$CLIENT_EMAILS" ] && ALL="${ALL:+$ALL,}$CLIENT_EMAILS"
          echo "merged=$ALL" >> "$GITHUB_OUTPUT"

      # ── 1c. Sync managed Access policies (allow + optional bypass) ──
      - name: Sync Access policies
        if: steps.access.outputs.access_ready == 'true'
        uses: Glassdocs/publisher/.github/actions/sync-access-policies@v1
        with:
          app-id: ${{ steps.access.outputs.app_id }}
          cf-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cf-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          email-domain: ${{ inputs.email-domain }}
          client-emails: ${{ steps.emails.outputs.merged }}
          client-domain: ${{ inputs.client-domain }}
          office-cidrs: ${{ vars.OFFICE_CIDRS }}

      # ── 2. Pre-flight: confirm Access is gating the domain ──
      - name: Pre-flight — verify Access is active
        if: steps.access.outputs.access_ready == 'true'
        env:
          DOMAIN: ${{ steps.access.outputs.domain }}
        run: |
          set -euo pipefail
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 "https://${DOMAIN}" 2>/dev/null || echo "000")

          echo "Pre-flight: https://${DOMAIN} returned HTTP ${HTTP_STATUS}"

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "::error::BLOCKED — site is publicly accessible BEFORE deploy. Access is not active."
            echo "::error::Check Cloudflare Zero Trust → Access → Applications for ${DOMAIN}"
            exit 1
          fi

          # 302/303 = Access login redirect (good)
          # 000     = site doesn't exist yet (first deploy — safe)
          # 4xx/5xx = site is down (safe to proceed)
          if [ "$HTTP_STATUS" = "000" ]; then
            echo "First deploy — site does not exist yet. Access app is pre-configured."
          else
            echo "Access is active (HTTP ${HTTP_STATUS})"
          fi

      # ── 3. Ensure the Pages project exists AND is a DIRECT-UPLOAD project ──
      # Runs every deploy. On first deploy it CREATES the project (direct upload);
      # on every deploy it verifies the project isn't a Cloudflare "Connect to Git"
      # project (those only accept Cloudflare-side builds, so `wrangler pages
      # deploy` fails on them). Both checks matter because the downstream deploy
      # step's own errors are opaque: a Git-connected project surfaces as "No
      # migration path exists", and a project that failed to create surfaces as the
      # misleading "The Pages project ... does not exist". We resolve both here and
      # print an actionable message instead. Project creation is done via the API
      # (not `wrangler ... || true`) so a transient Cloudflare error (code 8000000)
      # is RETRIED, and a persistent failure hard-fails with the real error rather
      # than being swallowed and mis-surfaced two steps later.
      - name: Ensure Pages project (direct-upload)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          RESP=$(curl -s -w $'\n%{http_code}' "${BASE}/${PROJECT_NAME}" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          CODE=$(printf '%s' "$RESP" | tail -n1)
          BODY=$(printf '%s' "$RESP" | sed '$d')
          if [ "$CODE" = "200" ]; then
            SOURCE=$(printf '%s' "$BODY" | jq -r '.result.source.type // empty')
            if [ -n "$SOURCE" ]; then
              echo "::error::Cloudflare Pages project '${PROJECT_NAME}' is connected to Git (${SOURCE}) in the Cloudflare dashboard. Glassdocs publishes by DIRECT UPLOAD from GitHub Actions and cannot deploy to a Git-connected project. Fix: Cloudflare dashboard → Workers & Pages → ${PROJECT_NAME} → Settings → Delete project, then redeploy — Glassdocs recreates it correctly. Do NOT use 'Connect to Git' for a Glassdocs KB; publishing is driven entirely from this workflow."
              exit 1
            fi
            echo "Pages project '${PROJECT_NAME}' exists (direct-upload) — OK."
          elif [ "$CODE" = "404" ]; then
            echo "Creating direct-upload Pages project '${PROJECT_NAME}'..."
            created=false
            for attempt in 1 2 3; do
              CR=$(curl -s -w $'\n%{http_code}' -X POST "$BASE" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" \
                --data "{\"name\":\"${PROJECT_NAME}\",\"production_branch\":\"main\"}")
              CRCODE=$(printf '%s' "$CR" | tail -n1)
              CRBODY=$(printf '%s' "$CR" | sed '$d')
              ERRS=$(printf '%s' "$CRBODY" | jq -c '.errors' 2>/dev/null || printf '%s' "$CRBODY")
              if [ "$CRCODE" = "200" ]; then created=true; echo "Created '${PROJECT_NAME}'."; break; fi
              # A concurrent run may have created it first — treat "name taken" as success.
              if printf '%s' "$CRBODY" | grep -qi 'already exists\|not unique\|8000009'; then
                created=true; echo "Project '${PROJECT_NAME}' already exists — continuing."; break
              fi
              echo "::warning::Create attempt ${attempt}/3 failed (HTTP ${CRCODE}): ${ERRS}. Retrying in 5s..."
              sleep 5
            done
            if [ "$created" != "true" ]; then
              echo "::error::Couldn't create Cloudflare Pages project '${PROJECT_NAME}' after 3 attempts (last: ${ERRS}). Cloudflare error 8000000 is usually a transient API blip — just re-run this deploy. If it persists: check the token has 'Cloudflare Pages: Edit' and that the account it belongs to matches CLOUDFLARE_ACCOUNT_ID (re-create the token from the Glassdocs 'Connect Cloudflare' deep link to fix both)."
              exit 1
            fi
          else
            echo "::warning::Couldn't verify the Pages project (HTTP ${CODE}); continuing. If the deploy fails with 'existing projects cannot be upgraded', the project is Git-connected — delete it in the Cloudflare dashboard and redeploy."
          fi

      # ── 4. Deploy the built site to Cloudflare Pages ──
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ inputs.wrangler-version || '' }}
          # Force npm (always on the runner). Without this, wrangler-action infers
          # the package manager from a lockfile in the KB repo — so a repo that
          # carries a pnpm-lock.yaml / yarn.lock (e.g. an app repo published as a
          # KB) makes it try pnpm/yarn, which isn't installed → "Unable to locate
          # executable file: pnpm". The KB's own lockfile is irrelevant to running
          # wrangler; pin npm so ANY repo deploys.
          packageManager: npm
          command: pages deploy ${{ env.SITE_DIR }} --project-name=${{ inputs.project-name }}

      # ── 5. First deploy: create Access app now that Pages project exists ──
      - name: Create Access app (first deploy)
        id: access-firstdeploy
        if: steps.access.outputs.access_ready == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOMAIN: ${{ steps.access.outputs.domain }}
        run: |
          set -euo pipefail
          BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/access"

          # On a TRUE first deploy the earlier step used the name-based domain because
          # the project didn't exist yet. Now it does — re-read its ACTUAL subdomain,
          # which is what the site is really served at (Cloudflare may have assigned a
          # collision suffix, e.g. <name>-xyz.pages.dev). Protecting anything else
          # yields Access error 12130 forever.
          REAL=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | jq -r '.result.subdomain // empty')
          [ -n "$REAL" ] && DOMAIN="$REAL"
          echo "Pages project now exists. Creating Access app for ${DOMAIN}..."

          # Create with a SHORT retry for genuine transient 5xx only. 12130
          # "domain does not belong to zone" here is NOT transient: with the real
          # subdomain it means this Cloudflare account doesn't own the domain (a
          # global name collision / the KB is wired to the wrong account) — retrying
          # can never fix it, so fail fast with an actionable message.
          APP_ID=""; LAST=""
          for attempt in 1 2 3; do
            LAST=$(curl -s -X POST "${BASE}/apps" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"${PROJECT_NAME}\",\"domain\":\"${DOMAIN}\",\"type\":\"self_hosted\",\"session_duration\":\"24h\"}")
            APP_ID=$(printf '%s' "$LAST" | jq -r '.result.id // empty')
            if [ -n "$APP_ID" ]; then echo "Created Access app on attempt ${attempt}: ${APP_ID}"; break; fi
            CODE=$(printf '%s' "$LAST" | jq -r '.errors[0].code // empty')
            MSG=$(printf '%s' "$LAST" | jq -r '.errors[0].message // "unknown"')
            echo "attempt ${attempt}/3 @ $(date -u +%H:%M:%SZ): code=${CODE} msg=${MSG}"
            if [ "$CODE" = "12130" ]; then
              echo "::error::Cloudflare says ${DOMAIN} does not belong to this account (Access error 12130). The site deployed here, but this account doesn't own that pages.dev domain — usually a global name collision (the plain <name>.pages.dev is taken by another account, so this project got a suffixed domain) or the KB is wired to the wrong Cloudflare account. Fix: delete this Pages project and redeploy once the plain name is free, or reconnect the KB to the account that owns the domain. The deployment is left in place."
              echo "$LAST" >&2; exit 1
            fi
            sleep 8
          done

          if [ -z "$APP_ID" ]; then
            echo "::error::Couldn't create the Access app for ${DOMAIN} after 3 attempts. Last response below. The deployment is left in place; re-run once resolved."
            echo "$LAST" >&2
            exit 1
          fi

          echo "Created Access app: $APP_ID"
          echo "app_id=${APP_ID}" >> "$GITHUB_OUTPUT"
          # Export the REAL subdomain so the post-deploy verify/rollback checks the
          # domain we actually protected — not the stale name-based domain, which on
          # a collision belongs to a DIFFERENT account (verifying it would either
          # green-light an unprotected site or roll back this good deployment).
          echo "real_domain=${DOMAIN}" >> "$GITHUB_OUTPUT"

      - name: Sync Access policies (first deploy)
        if: steps.access.outputs.access_ready == 'false'
        uses: Glassdocs/publisher/.github/actions/sync-access-policies@v1
        with:
          app-id: ${{ steps.access-firstdeploy.outputs.app_id }}
          cf-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cf-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          email-domain: ${{ inputs.email-domain }}
          client-emails: ${{ steps.emails.outputs.merged }}
          client-domain: ${{ inputs.client-domain }}
          office-cidrs: ${{ vars.OFFICE_CIDRS }}

      # ── 6. Post-deploy: verify the live site is gated ──
      # Runs whenever a deploy actually happened — INCLUDING when a later step
      # (e.g. Access-app creation) failed and aborted the job. Without this, a
      # failed gate setup would skip verification and leave the freshly deployed,
      # ungated site live. Gated on the deploy step so a build/deploy failure
      # (nothing new published) doesn't trigger a rollback of a prior good deploy.
      - name: Post-deploy — verify site is protected
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        env:
          # On a first deploy the access step's domain is name-based; prefer the
          # real subdomain the first-deploy step resolved after the project existed.
          DOMAIN: ${{ steps.access-firstdeploy.outputs.real_domain || steps.access.outputs.domain }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "Waiting for deployment to propagate..."
          sleep 15

          # FAIL CLOSED. A site behind Cloudflare Access answers an unauthenticated
          # request with a REDIRECT to the Access login (301/302/303/307/308). That
          # redirect is the ONLY positive proof the gate is up. Anything else —
          # 200 (content served = PUBLIC), 000 (couldn't reach it), 4xx, 5xx — is
          # NOT proof, so we roll back rather than declare success. Retry a few
          # times first to ride out propagation before deciding.
          STATUS="000"
          for attempt in 1 2 3 4; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://${DOMAIN}" || echo "000")
            echo "verify attempt ${attempt}/4: https://${DOMAIN} -> HTTP ${STATUS}"
            case "$STATUS" in
              301|302|303|307|308)
                echo "Gate confirmed — unauthenticated request redirects to Access login (HTTP ${STATUS})."
                exit 0
                ;;
            esac
            sleep 10
          done

          # Never observed the Access redirect → not provably gated → roll back.
          echo "::error::https://${DOMAIN} is NOT provably gated (last HTTP ${STATUS}; expected an Access login redirect). Rolling back to fail closed."
          DEPLOYMENTS=$(curl -s \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/deployments" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          LATEST_ID=$(echo "$DEPLOYMENTS" | jq -r '.result[0].id // empty')
          if [ -n "$LATEST_ID" ]; then
            curl -s -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/deployments/${LATEST_ID}?force=true" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
            echo "Rolled back deployment ${LATEST_ID}."
          fi
          exit 1
