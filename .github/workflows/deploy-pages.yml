# ═══════════════════════════════════════════════════════════════════════
# Reusable secure-by-default Markdown publisher (Zensical)
#
# A Glassdocs KB is Markdown, full stop: docs/*.md + mkdocs.yml, no custom
# HTML. This workflow builds that source with Zensical (the MkDocs successor
# from the Material team, which reads the KB's mkdocs.yml) and publishes the
# built site to Cloudflare Pages, secure by default:
#   1. A Cloudflare Access app + allow policy exist (fail-closed if none match)
#   2. Site is NOT publicly accessible before deploy (pre-flight)
#   3. Built site deploys to Cloudflare Pages
#   4. On first deploy, the Access app is created right after the project exists
#   5. Site is NOT publicly accessible after deploy (post-deploy)
#   6. If the post-deploy check proves the site is EXPOSED (content served to an
#      unauthenticated request), production is rolled back — or, on a first
#      deploy with nothing to roll back to, the project this run created is
#      deleted. A site that simply isn't reachable yet is not "exposed": the
#      Access configuration is verified over the API instead (#67).
#
# PUBLIC MODE (explicit opt-in, `public: true`): for documentation meant for
# the whole world (e.g. a product's public docs). No Access app is created —
# and one already gating the domain is REMOVED, since public is the declared
# intent — and the post-deploy check inverts: the site must be reachable
# (HTTP 200). Everything else (lint, build, headers) is unchanged. The
# default remains false: a KB never becomes public by omission.
#
# Usage in a consumer KB repo (.github/workflows/deploy.yml):
#   jobs:
#     deploy:
#       if: vars.CF_PAGES_PROJECT != ''
#       permissions:
#         contents: read
#         deployments: write
#       uses: Glassdocs/publisher/.github/workflows/deploy-pages.yml@v1
#       with:
#         project-name: ${{ vars.CF_PAGES_PROJECT }}
#       secrets: inherit
# ═══════════════════════════════════════════════════════════════════════

name: Docs Deploy (reusable)

on:
  workflow_call:
    inputs:
      project-name:
        description: "Cloudflare Pages project name (becomes <project-name>.pages.dev)"
        required: true
        type: string
      email-domain:
        description: "Staff email domain for the allow policy (e.g. acme.com). Empty (default) = NO domain-level access; grant specific people via allowed-emails / client-emails. Fail-closed: a KB with no access inputs deploys locked."
        required: false
        type: string
        default: ""
      allowed-emails:
        description: "Comma-separated email addresses to allow. If email-domain is empty, ONLY these emails get access."
        required: false
        type: string
        default: ""
      client-emails:
        description: "Comma-separated client email addresses to allow on this KB (in addition to the staff email-domain, if any)"
        required: false
        type: string
        default: ""
      client-domain:
        description: "A single client email domain to allow on this KB (in addition to the staff email-domain, if any)"
        required: false
        type: string
        default: ""
      public:
        description: "Publish this KB fully PUBLIC — no Cloudflare Access gate (an existing gate on the domain is removed). Explicit opt-in for world-readable docs; default false keeps the secure-by-default posture."
        required: false
        type: boolean
        default: false
      allow-financial:
        description: "Allow financial/contractual content in docs/ (only for pre-sales KBs)"
        required: false
        type: boolean
        default: false
      skip-lint:
        description: "Skip the compliance lint step (not recommended)"
        required: false
        type: boolean
        default: false
      python-version:
        description: "Python version used to build the site"
        required: false
        type: string
        default: "3.12"
      wrangler-version:
        description: "Pin a specific Wrangler version (leave empty for latest)"
        required: false
        type: string
        default: ""
      source-repo:
        description: "MANAGED hosting: owner/name of the KB repo to build. Empty (default) = build the calling repo (client-hosted). When set, SOURCE_TOKEN must grant read access."
        required: false
        type: string
        default: ""
      source-ref:
        description: "Git ref to build for source-repo (default: its default branch). Ignored when source-repo is empty."
        required: false
        type: string
        default: ""
    # Declared so callers in ANOTHER organization can pass them explicitly —
    # `secrets: inherit` only forwards within the same org/enterprise, so a
    # cross-org caller (a customer repo calling Glassdocs/publisher) MUST map
    # these by name. Optional so a not-yet-connected repo still runs and hits
    # the credential preflight with a clear message instead of a hard gate.
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: "Cloudflare API token (Pages:Edit + Access: Apps and Policies:Edit)"
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        description: "Cloudflare account id that owns the Pages project"
        required: false
      SOURCE_TOKEN:
        description: "MANAGED hosting: a token that can read source-repo (e.g. a Glassdocs App installation token). Unused for the client-hosted path."
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      PROJECT_NAME: ${{ inputs.project-name }}
      # PRE-RESOLUTION DEFAULTS, not facts. `docs` and `site` are Zensical's
      # defaults; the KB's mkdocs.yml decides the real ones via docs_dir/site_dir,
      # and the "Resolve KB layout from mkdocs.yml" step below overwrites both
      # through $GITHUB_ENV for every later step. This block used to assert
      # "always published from ./site", which is how a KB with site_dir set
      # published a stale ./site under a green tick (#153); DOCS_DIR was pinned to
      # `docs` on the lint step, which is how a KB with docs_dir set was linted
      # against a directory it does not have (#152).
      DOCS_DIR: docs
      SITE_DIR: site
    steps:
      # SECURITY: fail closed on a malformed project name before it reaches any
      # wrangler `command:` or Cloudflare API JSON body. Pages project names are
      # [a-z0-9-]; rejecting anything else stops argument/JSON injection when the
      # name is supplied directly as a repo variable (self-host) rather than via
      # the server's already-validated setup path.
      - name: Validate project name
        run: |
          case "$PROJECT_NAME" in
            ""|*[!a-z0-9-]*)
              echo "::error::Invalid Cloudflare Pages project name '$PROJECT_NAME' — only lowercase letters, digits, and hyphens are allowed."
              exit 1 ;;
          esac

      # Managed hosting needs a token that can read source-repo. Fail with a
      # clear message here rather than letting checkout fall back to
      # github.token and die with a confusing "repository not found".
      - name: Check managed-hosting source token
        if: ${{ inputs.source-repo != '' }}
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          # Env-indirection, not inline ${{ }}: source-repo is an unvalidated
          # workflow_call input (see the injection note on the meta step below).
          SOURCE_REPO: ${{ inputs.source-repo }}
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::error::SOURCE_TOKEN missing — source-repo is set ('${SOURCE_REPO}') but the SOURCE_TOKEN secret is empty, so the customer repo cannot be checked out. Pass a token that can read that repo to the reusable workflow."
            exit 1
          fi

      # Check out the KB source. Client-hosted (default): the caller's own repo.
      # Managed: the Glassdocs builder sets source-repo + SOURCE_TOKEN so we build
      # the customer's repo from the Glassdocs org.
      #
      # ref: with source-repo set, use source-ref as given — INCLUDING when it is
      # empty, which makes actions/checkout use that repo's default branch. The
      # old `source-repo != '' && source-ref || github.ref` ternary collapsed an
      # empty source-ref into the CALLER's github.ref, sending a ref from one
      # repo into a different (customer) repo.
      - name: Check out KB source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source-repo != '' && inputs.source-repo || github.repository }}
          ref: ${{ inputs.source-repo == '' && github.ref || inputs.source-ref }}
          token: ${{ inputs.source-repo != '' && secrets.SOURCE_TOKEN || github.token }}

      # Glassdocs is public, so the shared-asset fetch needs no auth. We only
      # need the security-headers template (_headers) and the compliance lint;
      # everything visual now comes from the KB's own mkdocs.yml + docs/.
      - name: Fetch Glassdocs platform files
        uses: actions/checkout@v4
        with:
          repository: Glassdocs/publisher
          ref: v1
          path: _playbook
          sparse-checkout: |
            templates/_headers
            templates/search/scripts/docs-lint.sh
            templates/search/scripts/inject-source-meta.mjs
            templates/read-aloud/read-aloud.js

      # setup-python's pip cache keys on a requirements/pyproject file and HARD
      # FAILS if none exists — which is exactly a minimal Markdown KB (mkdocs.yml
      # + docs/, no Python deps). Materialize the Zensical baseline so the cache
      # always has a key and builds are reproducible. A repo that ships its own
      # requirements.txt / docs/requirements.txt / pyproject.toml is left
      # untouched and still wins in the install step below.
      - name: Ensure a pip dependency file exists
        run: |
          set -euo pipefail
          if [ ! -f requirements.txt ] && [ ! -f docs/requirements.txt ] && [ ! -f pyproject.toml ]; then
            echo "zensical" > requirements.txt
            echo "No pip dependency file in the KB — wrote a baseline requirements.txt (zensical)."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      # WHERE the Markdown is read from and WHERE the build writes the site are
      # the KB's decisions, not ours. `docs_dir` and `site_dir` are first-class
      # MkDocs options that Zensical honours; `docs` and `site` are only its
      # DEFAULTS. Asserting the defaults produced two silent failures:
      #   - a KB that moved site_dir had its build output ignored and whatever
      #     already sat in ./site published instead — exit 0, green tick, wrong
      #     content served indefinitely (#153);
      #   - a KB that moved docs_dir was linted against a ./docs it does not
      #     have, which skipped BOTH hard checks and still printed
      #     "docs-lint: passed", and had every page stamped with a source-path
      #     under docs/ that does not exist (#152).
      #
      # This runs before the LINT (which consumes $DOCS_DIR) and before the build,
      # so `Set up Python` and its pip-cache prerequisite moved up with it; neither
      # depends on the lint. $GITHUB_ENV overrides the job-level `env:` for every
      # LATER step, so the lint, the meta injector, the audio copy, the headers
      # copy and `pages deploy` all follow this one answer.
      #
      # This step INSTALLS PyYAML, because it is not here yet. The comment that
      # used to sit here said "PyYAML is already installed (Zensical depends on it)
      # and `Set up Python` ran above", and that was false for every deploy this
      # workflow has ever run: `Set up Python` puts a fresh setup-python
      # interpreter first on PATH carrying pip/setuptools/wheel and nothing else,
      # while Zensical — and with it PyYAML — arrives at `Install site generator`
      # over a hundred lines below. Measured on Glassdocs/docs run 31773404608:
      # `exit 4 — falling back to a text read` at 05:34:13, `Successfully
      # installed … pyyaml-6.0.3` at 05:34:20. The wheel is in the pip cache that
      # `Set up Python` just restored, so the install is a cached, ~1 s no-op that
      # Zensical repeats later anyway (#228).
      #
      # There is exactly ONE reader, and it is fail-closed. The text fallback that
      # used to stand behind it is deleted: it was not a safety net but the only
      # thing that ever ran, and it made the `rc=3` refusal below unreachable in
      # production. The two disagreed on real input — an unparseable mkdocs.yml
      # gave `exit 1 + ::error::` under an interpreter with PyYAML and `exit 0,
      # DOCS_DIR=docs SITE_DIR=public` under the one the deploy actually used,
      # guessing a layout out of a file nobody could parse. A KB whose mkdocs.yml
      # does not parse now FAILS rather than deploying a guess; that is the point.
      #
      # The read COMPOSES the YAML rather than loading it, and that is
      # load-bearing: a Material-flavoured mkdocs.yml legitimately carries custom
      # tags (`!ENV`, and `!!python/name:pymdownx...` for superfences/emoji — this
      # repo's own mkdocs.yml has one), and yaml.safe_load raises ConstructorError
      # on them. Composing never invokes a constructor, so any config Zensical can
      # build is one this step can read.
      - name: Resolve KB layout from mkdocs.yml
        run: |
          set -uo pipefail

          if [ ! -f mkdocs.yml ]; then
            echo "::error::No mkdocs.yml at repo root. A Glassdocs KB is Markdown: docs/*.md + mkdocs.yml."
            exit 1
          fi

          PY=$(command -v python || command -v python3 || true)
          if [ -z "$PY" ]; then
            echo "::error::No Python interpreter on PATH, so mkdocs.yml cannot be parsed and this KB's docs_dir/site_dir are unknown. Refusing to guess."
            exit 1
          fi

          # Best-effort, because the IMPORT below is the gate — not this. A KB
          # whose runner already has PyYAML skips it (and so does the test suite,
          # which must not mutate a developer's site-packages); a KB whose install
          # fails still gets a hard, named failure a few lines down rather than a
          # silently guessed layout.
          if ! "$PY" -c 'import yaml' >/dev/null 2>&1; then
            echo "Installing PyYAML to read mkdocs.yml (setup-python ships a bare interpreter)."
            "$PY" -m pip install --quiet --disable-pip-version-check "pyyaml>=6" || true
          fi

          rc=0
          layout=$("$PY" - <<'PY_EOF'
          import sys
          try:
              import yaml
          except ImportError:
              sys.exit(4)
          try:
              root = yaml.compose(open("mkdocs.yml", encoding="utf-8"), Loader=yaml.SafeLoader)
          except Exception as exc:
              print(exc, file=sys.stderr)
              sys.exit(3)
          keys = {}
          if isinstance(root, yaml.MappingNode):
              for key, value in root.value:
                  if isinstance(key, yaml.ScalarNode) and isinstance(value, yaml.ScalarNode):
                      keys[key.value] = value.value
          print(keys.get("docs_dir") or "docs")
          print(keys.get("site_dir") or "site")
          PY_EOF
          ) || rc=$?

          if [ "$rc" -eq 3 ]; then
            echo "::error::mkdocs.yml could not be parsed as YAML, so this KB's docs_dir/site_dir are unknown. Refusing to guess — linting the wrong directory and publishing the wrong directory are both silent. Fix mkdocs.yml and re-run."
            exit 1
          fi
          if [ "$rc" -eq 4 ]; then
            echo "::error::PyYAML is not available to read mkdocs.yml, so this KB's docs_dir/site_dir are unknown. Refusing to guess — linting the wrong directory and publishing the wrong directory are both silent. The install above failed; re-run the deploy."
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::Reading mkdocs.yml failed (exit ${rc}), so this KB's docs_dir/site_dir are unknown. Refusing to guess."
            exit 1
          fi
          DOCS_DIR=$(printf '%s\n' "$layout" | sed -n 1p)
          SITE_DIR=$(printf '%s\n' "$layout" | sed -n 2p)

          # A directory that escapes the repo would point the lint at someone
          # else's files and hand `pages deploy` an arbitrary path on a runner
          # holding the Cloudflare token. Refuse before either happens.
          for pair in "docs_dir:$DOCS_DIR" "site_dir:$SITE_DIR"; do
            key=${pair%%:*}
            val=${pair#*:}
            case "$val" in
              ""|/*|..|../*|*/..|*/../*)
                echo "::error::mkdocs.yml sets ${key} to '${val}', which is empty or escapes the repository. Refusing: the publisher lints, injects into and deploys that directory."
                exit 1 ;;
            esac
          done

          {
            echo "DOCS_DIR=$DOCS_DIR"
            echo "SITE_DIR=$SITE_DIR"
          } >> "$GITHUB_ENV"
          echo "KB layout from mkdocs.yml: docs_dir=$DOCS_DIR site_dir=$SITE_DIR"

      # Compliance lint on the Markdown source — fails the deploy on violations
      # BEFORE any side effects. Markdown-only rules: a docs dir exists, a deploy
      # workflow exists, no custom HTML is tracked, no commercial content unless
      # allow-financial.
      #
      # $DOCS_DIR is deliberately NOT declared here: a step-level `env:` overrides
      # $GITHUB_ENV, so pinning it to `docs` was what stopped the resolved value
      # from ever reaching the lint (#152). It comes from the resolution step
      # above, falling back to the job-level default.
      - name: Run docs compliance lint
        if: ${{ !inputs.skip-lint }}
        env:
          ALLOW_FINANCIAL: ${{ inputs.allow-financial }}
        run: |
          set -uo pipefail
          out=$(bash _playbook/templates/search/scripts/docs-lint.sh) || rc=$?
          rc=${rc:-0}
          echo "$out" | while IFS= read -r line; do
            case "$line" in
              FAIL:*) echo "::error::${line#FAIL: }" ;;
              WARN:*) echo "::warning::${line#WARN: }" ;;
              *)      echo "$line" ;;
            esac
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error::Docs lint failed. See https://github.com/Glassdocs/glassdocs for playbook rules. Deploy blocked."
            exit "$rc"
          fi

      # Zensical reads the KB's mkdocs.yml unchanged. A KB may pin Zensical (or
      # extra plugins) via requirements.txt or docs/requirements.txt; if it ships
      # neither, install Zensical directly. Mirrors docs-playbook's Zensical build.
      - name: Install site generator
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            echo "Installing requirements.txt"
            pip install -r requirements.txt
          elif [ -f docs/requirements.txt ]; then
            echo "Installing docs/requirements.txt"
            pip install -r docs/requirements.txt
          else
            echo "No requirements file — installing zensical directly"
            pip install zensical
          fi

      - name: Build site
        run: |
          set -euo pipefail
          if [ ! -f mkdocs.yml ]; then
            echo "::error::No mkdocs.yml at repo root. A Glassdocs KB is Markdown: docs/*.md + mkdocs.yml."
            exit 1
          fi
          zensical build

      # Nothing between `zensical build` and `pages deploy` proved that $SITE_DIR
      # holds THIS run's output. The resolution above covers the common case; this
      # covers the residue (a half-failed build, a site_dir the read could not
      # follow) by turning "published the wrong tree" into a blocked deploy (#153).
      - name: Verify the build produced a site
        run: |
          set -uo pipefail
          [ -f "$SITE_DIR/index.html" ] || { echo "::error::zensical build produced no $SITE_DIR/index.html"; exit 1; }

      # Pull this KB's generated page audio out of its GitHub Release and into
      # the site, so it ships as part of THIS deployment (#94).
      #
      # THIS STEP RUNS BEFORE THE INJECTOR, and the order is load-bearing (#97).
      # It used to sit below "Add the in-page read-aloud control", which meant the
      # injector could not know what audio had shipped and so could not stamp
      # `audio-file` / `audio-sha` into the pages that have a clip — leaving a
      # tenant's paid-for narration on the site with no way for a reader to play
      # it. It has no dependency on the injector, on _headers or on the read-aloud
      # cp: it reads a GitHub release and writes into $SITE_DIR/audio/. The
      # alternative — leaving the order alone and running the injector twice —
      # would work (injectInto is a proven fixed point) but doubles the HTML pass
      # over every page and recomputes every source path and blob sha for nothing.
      #
      # WHY SAME-ORIGIN, and why it is not negotiable: `_headers` (copied from the
      # platform template a few steps BELOW this one, because "security posture is
      # not a per-KB choice") sets `default-src 'self'` and declares NO
      # `media-src` — so media inherits `'self'` and only the KB's own origin can
      # be played. That is also the only place inside the KB's Cloudflare Access
      # app: audio served from a bucket or a second origin would be the spoken
      # content of a gated page, reachable without the gate. Serving it from
      # $SITE_DIR is what makes a private KB's audio as private as the page it was
      # spoken from. The argument is about what the DEPLOYED site serves, so it is
      # unaffected by which step copies _headers first.
      #
      # Both tiers, one code path: client-hosted checks out with github.token
      # under `permissions: contents: read` (declared at the top of this job) and
      # managed checks out with SOURCE_TOKEN, a Glassdocs App installation token
      # carrying the same Contents permission. A repo's own releases sit under
      # Contents, so the same request works either way.
      #
      # FAIL-CLOSED. Audio ships only when vars.AUDIO_ENABLED is exactly `true`.
      # Unset, empty, `1`, `yes`, `TRUE` → no site/audio/, no manifest, nothing
      # for a reader to click, and no reader-side logic needed to make that true.
      # Any failure fetching (no release, a bad asset, a network error) also lands
      # on "no audio" and only WARNS: audio is a derived artifact, and blocking a
      # documentation deploy over it would be the worse failure.
      #
      # vars.* in a REUSABLE workflow resolves against the CALLING repository, the
      # same way office-cidrs does further down — so this flag reaches every
      # existing KB the moment the publisher release lands, with no re-scaffold
      # and no PR into a customer repo. (Whoever writes and surfaces the variable
      # is a separate change; this step only reads it.)
      - name: Fetch published audio
        env:
          # Env-indirection, NOT `${{ }}` inlined into the script below — same
          # reason as the meta step above: these are caller-controlled values on
          # a runner that holds SOURCE_TOKEN and the Cloudflare token, and bash
          # re-evaluates inlined interpolation. As $VARS they are data, never code.
          AUDIO_ENABLED: ${{ vars.AUDIO_ENABLED }}
          AUDIO_REPO: ${{ inputs.source-repo != '' && inputs.source-repo || github.repository }}
          AUDIO_TOKEN: ${{ inputs.source-repo != '' && secrets.SOURCE_TOKEN || github.token }}
          AUDIO_TAG: glassdocs-audio
        run: |
          set -uo pipefail
          if [ "${AUDIO_ENABLED:-}" != "true" ]; then
            if [ -n "${AUDIO_ENABLED:-}" ]; then
              echo "::warning::AUDIO_ENABLED is set to '${AUDIO_ENABLED}', which is not the literal string 'true' — publishing NO audio. Set the repo variable AUDIO_ENABLED to exactly 'true' to publish it."
            else
              echo "Audio publishing is off (AUDIO_ENABLED unset) — no site/audio/, no manifest."
            fi
            exit 0
          fi

          API="https://api.github.com"
          AUTH="Authorization: Bearer ${AUDIO_TOKEN}"
          VSN="X-GitHub-Api-Version: 2022-11-28"

          # A lookup that FAILED is not a repo that has no release. `curl -sS`
          # without --fail exits 0 on an HTTP 401/403/5xx and prints the API's
          # error object ({"message":"Bad credentials"}), so `.id // empty` came
          # back empty and the step asserted "no audio generated yet" — advice
          # that sends a tenant to regenerate clips they already have, behind a
          # green deploy with a silent site (#171). Same shape as the asset
          # listing below before #159: an error folded into an empty result.
          #
          # --fail is NOT the fix. It makes 401 and 404 both exit non-zero,
          # collapsing them again just into the other bucket, and it discards
          # the body — and the API's `message` is the most useful thing to put
          # in the warning. So take the status and the body separately.
          REL_BODY="$(mktemp)"
          REL_CODE=$(curl -sS -H "$AUTH" -H "$VSN" -H "Accept: application/vnd.github+json" \
                       --max-time 30 -o "$REL_BODY" -w '%{http_code}' \
                       "${API}/repos/${AUDIO_REPO}/releases/tags/${AUDIO_TAG}") || REL_CODE=''
          # The API's own diagnosis, never the token. Absent on a transport failure.
          REL_MSG=$(jq -r '.message // empty' <"$REL_BODY" 2>/dev/null || echo '')
          case "${REL_CODE:-}" in
            404)
              # The legitimate case: this KB has never generated audio. Not a
              # failure — the docs deploy carries on exactly as before.
              echo "::notice::AUDIO_ENABLED is on but ${AUDIO_REPO} has no '${AUDIO_TAG}' release yet — nothing to publish. Generate audio from the Glassdocs admin first."
              exit 0
              ;;
            2??)
              ;;
            *)
              # 401/403/5xx, or curl failed/timed out. Abandon the audio step
              # with a warning, matching the `list_ok=false` outcome below: a
              # token that lost scope on a separate audio repo must not take
              # down documentation publishing.
              echo "::warning::Could not look up the '${AUDIO_TAG}' release in ${AUDIO_REPO} (HTTP ${REL_CODE:-none — curl failed or timed out}${REL_MSG:+ — ${REL_MSG}}) — publishing no audio this deploy. This is NOT 'no audio generated yet': check the token's access to ${AUDIO_REPO}."
              exit 0
              ;;
          esac
          REL_ID=$(jq -r '.id // empty' <"$REL_BODY" 2>/dev/null || echo '')
          if [ -z "$REL_ID" ]; then
            echo "::warning::The '${AUDIO_TAG}' release lookup in ${AUDIO_REPO} returned HTTP ${REL_CODE} with no release id — publishing no audio this deploy."
            exit 0
          fi

          # PAGE the asset listing. `per_page` is a page SIZE, never a pagination
          # strategy: GitHub caps it at 100 and silently clamps anything larger
          # (measured 2026-08-13 — `/repos/cli/cli/releases?per_page=150` returns
          # 100). A KB page is TWO assets (<key>.opus + <key>.json), so one
          # request only ever reached ~50 pages of the KB; past that the clips
          # were simply absent, the reconciliation below dropped their sidecars,
          # and the deploy went green with most of the KB silently mute (#159).
          #
          # A page that FAILS is not a page that is empty. The old `|| echo '[]'`
          # made a network error indistinguishable from "this KB has no assets"
          # and landed on "publish no audio" with no warning at all — so a failed
          # request now says so and abandons the whole audio step, rather than
          # publishing whichever prefix happened to arrive.
          ASSETS='[]'
          PAGE=1
          list_ok=true
          while :; do
            PAGE_JSON=$(curl -sS -H "$AUTH" -H "$VSN" -H "Accept: application/vnd.github+json" \
                          --max-time 30 "${API}/repos/${AUDIO_REPO}/releases/${REL_ID}/assets?per_page=100&page=${PAGE}") || PAGE_JSON=''
            # An error object ({"message":"Bad credentials"}) is not an array, so
            # `empty` leaves PAGE_N unset and it is treated as a failed page.
            PAGE_N=$(printf '%s' "$PAGE_JSON" | jq -r 'if type == "array" then length else empty end' 2>/dev/null || echo '')
            if [ -z "$PAGE_N" ]; then
              echo "::warning::Could not list page ${PAGE} of the '${AUDIO_TAG}' release assets — publishing no audio this deploy."
              list_ok=false
              break
            fi
            ASSETS=$(printf '%s\n%s\n' "$ASSETS" "$PAGE_JSON" | jq -c -s 'add') || {
              echo "::warning::Could not merge page ${PAGE} of the '${AUDIO_TAG}' release asset listing — publishing no audio this deploy."
              list_ok=false
              break
            }
            if [ "$PAGE_N" -lt 100 ]; then
              break
            fi
            # Backstop against a listing that never comes back short. 50 pages is
            # 5000 assets (2500 KB pages); stopping is still truncation, so it is
            # loud rather than silent.
            if [ "$PAGE" -ge 50 ]; then
              echo "::warning::Stopped listing '${AUDIO_TAG}' release assets after ${PAGE} pages (5000 assets) — some pages will ship without audio."
              break
            fi
            PAGE=$((PAGE + 1))
          done
          if [ "$list_ok" != "true" ]; then
            exit 0
          fi

          # Stage in a temp dir and only move it into the site once everything
          # downloaded. A half-fetched site/audio/ would serve truncated clips.
          STAGE="$(mktemp -d)"
          META="$(mktemp -d)"
          ok=true
          # Asset names this publisher owns: gd-audio-<20 hex>.<ext>. The filter is
          # also the path guard — the name becomes a filename, and GitHub's own
          # rewriting of unsafe characters is not something to rely on.
          NAMES=$(printf '%s' "$ASSETS" | jq -r '.[] | select(.name | test("^gd-audio-[0-9a-f]{20}\\.[A-Za-z0-9]+$")) | "\(.id) \(.name)"')
          while read -r ID NAME; do
            [ -n "${ID:-}" ] || continue
            case "$NAME" in
              gd-audio-*.json) DEST="${META}/${NAME}" ;;
              *)               DEST="${STAGE}/${NAME}" ;;
            esac
            # -L follows GitHub's 302 to release-assets.githubusercontent.com.
            # curl drops the Authorization header on a cross-host redirect (and
            # --location-trusted, which would keep it, is deliberately NOT used),
            # so the installation token is never handed to the asset CDN.
            if ! curl -sSL -f -H "$AUTH" -H "Accept: application/octet-stream" \
                   --max-time 120 -o "$DEST" "${API}/repos/${AUDIO_REPO}/releases/assets/${ID}"; then
              echo "::warning::Failed to download audio asset ${NAME} — publishing no audio this deploy."
              ok=false
              break
            fi
          done <<< "$NAMES"

          if [ "$ok" != "true" ]; then
            rm -rf "$STAGE" "$META"
            exit 0
          fi

          # How many pages the release CLAIMS audio for, counted BEFORE the
          # reconciliation below throws any of them away. The gap between this
          # and the manifest is the tenant-visible symptom of a truncated read,
          # and it has to be legible in the log: "40 of 90 pages shipped" is the
          # sentence a tenant needs, and per-orphan warnings never added up to it.
          SIDECARS=$(find "$META" -name 'gd-audio-*.json' | wc -l | tr -d ' ')

          # Drop any sidecar whose clip is missing or whose byte count disagrees
          # with the file we actually downloaded. The reader must never be handed
          # a manifest entry pointing at a 404 or at truncated audio.
          for S in "${META}"/gd-audio-*.json; do
            [ -f "$S" ] || continue
            CLIP=$(jq -r '.audio // empty' "$S" 2>/dev/null || echo '')
            WANT=$(jq -r '.bytes // empty' "$S" 2>/dev/null || echo '')
            if [ -z "$CLIP" ] || [ ! -f "${STAGE}/${CLIP}" ]; then
              echo "::warning::Audio sidecar $(basename "$S") has no matching clip on the release — skipping that page."
              rm -f "$S"
              continue
            fi
            GOT=$(wc -c < "${STAGE}/${CLIP}" | tr -d ' ')
            if [ -n "$WANT" ] && [ "$WANT" != "$GOT" ]; then
              echo "::warning::Audio clip ${CLIP} is ${GOT} bytes but its sidecar says ${WANT} — skipping that page."
              rm -f "$S" "${STAGE}/${CLIP}"
            fi
          done

          # The manifest is REGENERATED from the assets actually present, never
          # carried over: D1 is the source of truth for what was generated, this
          # file is the derived statement of what THIS deployment serves. Keyed by
          # source path, carrying the source_sha the reader compares against the
          # page's own <meta name="source-sha"> — a mismatch means the page was
          # edited since, and #97 must say so rather than play stale audio.
          COUNT=$(find "$META" -name 'gd-audio-*.json' | wc -l | tr -d ' ')
          if [ "$COUNT" = "0" ]; then
            if [ "$SIDECARS" != "0" ]; then
              echo "::warning::Audio: 0 of ${SIDECARS} page(s) on the '${AUDIO_TAG}' release survived reconciliation — publishing no audio."
            else
              echo "::notice::No usable audio clips on the '${AUDIO_TAG}' release — publishing no audio."
            fi
            rm -rf "$STAGE" "$META"
            exit 0
          fi
          if ! jq -s --arg repo "$AUDIO_REPO" '{
                 version: 1,
                 repo: $repo,
                 pages: (map(select(.path and .audio) | {
                   key: .path,
                   value: {
                     file: ("/audio/" + .audio),
                     source_sha: .source_sha,
                     voice: .voice,
                     model: .model,
                     bytes: .bytes,
                     duration_seconds: .duration_seconds,
                     # The section timeline (#300): integers only — a start
                     # offset in deciseconds and a spoken-character count per
                     # heading. Absent on every clip generated before #300, and
                     # `null` here for those; the injector drops anything that is
                     # not a well-formed map rather than stamping it.
                     sections: .sections,
                     generated_at: .generated_at
                   }
                 }) | from_entries)
               }' "${META}"/gd-audio-*.json > "${STAGE}/manifest.json"; then
            echo "::warning::Could not build /audio/manifest.json — publishing no audio this deploy."
            rm -rf "$STAGE" "$META"
            exit 0
          fi
          COUNT=$(jq -r '.pages | length' "${STAGE}/manifest.json")
          if [ "$COUNT" != "$SIDECARS" ]; then
            # Still only a warning: audio is a derived artifact and blocking a
            # documentation deploy over it would be the worse failure (see the
            # step header). But the tenant can now read the shortfall directly.
            echo "::warning::Audio: ${COUNT} of ${SIDECARS} page(s) on the '${AUDIO_TAG}' release made it into /audio/manifest.json — the rest are listed above and will ship without audio."
          fi
          mkdir -p "${SITE_DIR}/audio"
          cp -R "${STAGE}/." "${SITE_DIR}/audio/"
          rm -rf "$STAGE" "$META"
          echo "Published audio for ${COUNT} page(s) into ${SITE_DIR}/audio/ (same-origin, inside this KB's Access app)."

      # Inject GlassDocs recognition meta (source-repo / source-path) into the
      # built HTML so the browser extension recognises this site and maps each
      # page to its Markdown source. Post-build + build-agnostic on purpose:
      # Zensical rewrote theming, so mkdocs-material template overrides are a
      # no-op — the repo identity is a deploy-time fact, injected here where CI
      # actually knows it. Non-fatal if the repo can't be determined.
      - name: Inject GlassDocs recognition meta
        env:
          # Env-indirection, NOT `${{ }}` inlined into the script line: source-repo
          # is an unvalidated workflow_call input, and bash re-evaluates inlined
          # interpolation, so inlining it would allow shell injection on the runner
          # that later holds SOURCE_TOKEN + the Cloudflare token. Passed as $REPO,
          # the value is data, never code. (The injector also validates the format
          # and bails safely if it isn't OWNER/NAME.)
          REPO: ${{ inputs.source-repo != '' && inputs.source-repo || github.repository }}
          # #210 — the publisher release that built this page. `@v1` is a moving
          # pointer: it moved three times in 26 hours and the released artefact
          # recorded nothing, so "which publisher release built this KB?" could
          # only be answered from a tenant's checkout log, which expires and which
          # no reader of a published page can reach.
          #
          # These MUST be step-level. The contexts reference's availability table
          # lists `job` under `jobs.<job_id>.steps.env` but NOT under
          # `jobs.<job_id>.env` — a job-level block renders them empty, and the
          # failure is silent (an unstamped page looks exactly like an older
          # publisher). Env-indirection for the same reason as $REPO above: these
          # are interpolated values on a runner that later holds SOURCE_TOKEN and
          # the Cloudflare token, so they stay data and never become script text.
          #
          # WORKFLOW_REF is what the tenant ASKED for
          # (…/deploy-pages.yml@refs/tags/v1); WORKFLOW_SHA is what they GOT. Both
          # are needed: the ref alone is the moving pointer this fixes, and the sha
          # alone cannot tell `@v1` from a SHA-pinned tenant.
          #
          # It must be `job.`, never `github.`. In a reusable workflow the `github`
          # context belongs to the CALLER, so `github.workflow_ref` names the
          # tenant's own deploy.yml — the one thing we already know — while
          # `job.workflow_ref` is documented as "For jobs defined in a reusable
          # workflow, this refers to the reusable workflow file".
          #
          # actionlint (through 1.7.12, and on its main branch) rejects both lines:
          # its `job` context type declares only check_run_id/container/services/
          # status and has never been updated for workflow_ref/workflow_sha/
          # workflow_repository. That is a stale type model, not a real error — the
          # three are documented in GitHub's contexts reference — and nothing in
          # this repo's CI runs actionlint. Do not "fix" it by reaching for
          # `github.`; that silently stamps the wrong repository.
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -uo pipefail
          # `job.workflow_sha` is documented as unavailable on GitHub Enterprise
          # Server. Both halves are required or the stamp is omitted: a half-value
          # like `refs/tags/v1@` is non-empty, would be injected, and would claim a
          # release identity it does not have.
          release=""
          if [ -n "${WORKFLOW_REF:-}" ] && [ -n "${WORKFLOW_SHA:-}" ]; then
            release="${WORKFLOW_REF##*@}@$WORKFLOW_SHA"
          fi
          # Echoed because the first release is what PROVES the contexts resolve —
          # this is the only place the raw values are visible, and an unstamped
          # page is otherwise indistinguishable from a tenant on an older tag.
          echo "publisher release: workflow_ref=${WORKFLOW_REF:-<empty>} workflow_sha=${WORKFLOW_SHA:-<empty>}"
          echo "publisher release: glassdocs-release=${release:-<omitted — pages carry no release stamp>}"
          # --audio-manifest (#97): the manifest the audio step above just wrote,
          # naming every page this deployment serves a clip for. Passed
          # UNCONDITIONALLY and by path, exactly like --release: a KB with no
          # audio (AUDIO_ENABLED unset, or nothing generated yet) has no such
          # file, the injector treats that as "no audio anywhere", emits no audio
          # meta, and the deploy is byte-for-byte what it was before. The feature
          # is inert, not off.
          node _playbook/templates/search/scripts/inject-source-meta.mjs \
            --repo "$REPO" \
            --release "$release" \
            --audio-manifest "$SITE_DIR/audio/manifest.json" \
            --site "$SITE_DIR" --docs-dir "$DOCS_DIR"
          # The manifest is build-time INPUT, not site content (#289). The
          # injector above is its only reader anywhere — nothing fetches it at
          # runtime; the in-page player and the extension both resolve a clip
          # from the page's own <meta> tags, and each records that choice
          # deliberately. So it leaves the site root here rather than being
          # served, world-readable, by every KB that declares `public: true`.
          # The clips stay: they are what the reader plays.
          #
          # AFTER the node call, never instead of the `cp` that put it here.
          # Withholding it from that copy hands the injector a path that does
          # not exist, which loadAudioManifest() reads as "no audio anywhere"
          # SILENTLY — no audio-file, no audio-sha, no audio-sections, so no ▶
          # on any page of any KB, behind a green deploy. That is the #97
          # failure 2374114 reordered these two steps to fix. Measured, not
          # inferred: with the manifest excluded from the copy the chain still
          # exits 0 and prints `source-sha on 3; audio on 0`.
          #
          # `rm -f`: a KB with no audio has no $SITE_DIR/audio at all, and the
          # step runs under `set -uo pipefail`, so a missing path must not fail
          # a documentation deploy.
          rm -f "$SITE_DIR/audio/manifest.json"

      # _headers (security headers + CSP) is a Cloudflare Pages control file and
      # must sit at the site root. It ALWAYS comes from the platform template —
      # security posture is not a per-KB choice.
      - name: Add security headers
        run: cp _playbook/templates/_headers "$SITE_DIR/_headers"

      # The in-page read-aloud control (#187): a ▶ rendered INSIDE the published
      # page, driving the reader's own speech engine. It exists because the
      # extension's read-aloud reaches only desktop Chrome — there is no Chrome
      # extension on iOS and no MV3 side panel on Android Chrome — so before this,
      # no phone could hear a KB page at all.
      #
      # WHAT IT SENDS, exactly (#97 amended this — the previous wording said "no
      # network request of any kind" and is no longer true):
      #
      #   on page load          nothing, on every page, whatever it carries. No
      #                         fetch, no beacon, no analytics, no control-plane
      #                         call — asserted by route interception in
      #                         extension/e2e/read-aloud-page.spec.mjs.
      #   ▶ Listen              nothing. The audio is produced by the reader's own
      #                         browser and OS, with a voice whose localService is
      #                         true, and it refuses to speak rather than fall back
      #                         to a remote synthesiser.
      #   ▶ AI (only if this
      #   page has a current
      #   clip in this deploy)  exactly one request, made only by that press: a GET
      #                         for /audio/<the clip this page named>, on the KB's
      #                         OWN origin, inside this KB's own Access app. The
      #                         <audio> element carries preload="none", so nothing
      #                         is fetched until the press.
      #
      # Nothing about which page a reader is on ever leaves the device: whether a
      # clip exists is answered by two <meta> tags in the page the reader already
      # loaded, never by asking us.
      #
      # UNCONDITIONAL, and deliberately NOT gated on vars.AUDIO_ENABLED. That
      # variable switches off the generation-and-storage pipeline above (Kokoro,
      # Release assets, R2), which the browser-TTS route does not use — and the
      # AI control gates itself, on the presence of those metas, which the
      # injector emits only for a KB that published a clip. So a KB with audio off
      # gets the browser-TTS floor and nothing else, with no per-KB configuration.
      # Making the cp conditional would also make an absent platform asset a
      # LEGITIMATE tenant state, and it never is: unlike the audio Release lookup,
      # a missing file here is always a broken release, so `cp` failing the deploy
      # is the correct and intended behaviour.
      #
      # A tenant who objects on brand grounds hides it with one rule on
      # `#glassdocs-read-aloud` in their own extra_css — no platform surface, no
      # per-repo configuration, which is the whole point of this route.
      - name: Add the in-page read-aloud control
        run: |
          set -euo pipefail
          mkdir -p "$SITE_DIR/assets"
          cp _playbook/templates/read-aloud/read-aloud.js "$SITE_DIR/assets/glassdocs-read-aloud.js"

      # ── 0. Cloudflare credential preflight ──
      # Report exactly what arrived so an empty/short secret is diagnosable at a
      # glance (the API otherwise fails with a cryptic "could not route" when the
      # account id is blank). Token is masked by Actions; we print only its
      # length. The account id is not a secret, so we verify + echo it, and
      # confirm the token can actually reach the account before doing anything.
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_MODE: ${{ inputs.public }}
        run: |
          set -uo pipefail
          echo "CLOUDFLARE_API_TOKEN:  present=${CLOUDFLARE_API_TOKEN:+yes}${CLOUDFLARE_API_TOKEN:-NO}  length=${#CLOUDFLARE_API_TOKEN}"
          echo "CLOUDFLARE_ACCOUNT_ID: present=${CLOUDFLARE_ACCOUNT_ID:+yes}${CLOUDFLARE_ACCOUNT_ID:-NO}  length=${#CLOUDFLARE_ACCOUNT_ID}  value='${CLOUDFLARE_ACCOUNT_ID}'"
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Cloudflare credentials are empty in this run. The KB repo needs CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID as Actions **secrets** (use 'Connect Cloudflare' in the Glassdocs admin, or set them on the repo). If they ARE set on the repo but still arrive empty here, the reusable workflow isn't inheriting them — check that the caller passes 'secrets: inherit'."
            exit 1
          fi
          # Prove the token reaches the account (verify + Access scope) up front.
          # A PUBLIC KB never touches Access APIs beyond the best-effort gate
          # removal, so a missing Access scope is only fatal for gated KBs.
          VER=$(curl -s -o /dev/null -w "%{http_code}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          ACC=$(curl -s -o /dev/null -w "%{http_code}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/access/apps?per_page=1" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          echo "token verify → ${VER}   access/apps → ${ACC}"
          if [ "${ACC}" != "200" ]; then
            if [ "${PUBLIC_MODE}" = "true" ]; then
              echo "::warning::The Cloudflare token can't reach Access (HTTP ${ACC}). Fine for a public KB — but if a leftover Access gate exists on this domain, it can't be removed automatically."
            else
              echo "::error::The Cloudflare token can't reach Access on account ${CLOUDFLARE_ACCOUNT_ID} (HTTP ${ACC}). It needs 'Access: Apps and Policies: Edit'. Re-create it from the Glassdocs deep link."
              exit 1
            fi
          fi

      # ── 1. Ensure Cloudflare Access app exists ──
      # The app covers the apex AND `*.<domain>` — direct-upload never creates
      # preview deployments, but anyone holding the Pages token could; the
      # wildcard means such a preview URL (hash.<name>.pages.dev) is gated too
      # instead of bypassing the apex-only app (publisher#3).
      # On first deploy the Pages project doesn't exist yet, so Access app
      # creation will fail. We record that and create it after deploy instead.
      - name: Ensure Cloudflare Access app
        id: access
        if: ${{ !inputs.public }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Derive the Access domain from the project's ACTUAL subdomain, not the
          # project name. On a GLOBAL pages.dev name collision Cloudflare assigns a
          # suffixed subdomain (e.g. <name>-xyz.pages.dev); protecting <name>.pages.dev
          # would target a domain owned by a DIFFERENT account and fail forever with
          # Access error 12130 "domain does not belong to zone". Query the real
          # subdomain when the project exists; fall back to the name-based domain only
          # on a true first deploy (project not created yet).
          #
          # ── A lookup that FAILED is not a project that is ABSENT (#239) ──
          # This is the canonical copy of the resolver; three other steps below carry
          # the same function and point back here.
          #
          # `curl -s` without --fail exits 0 on a 401/403/429/5xx and prints
          # {"success":false,"errors":[…]} — so `.result.subdomain // empty` came back
          # empty for EVERY failure, and this step announced "project not created yet"
          # about a project that plainly exists, then guessed <name>.pages.dev. On a
          # global pages.dev name collision that guess belongs BY DEFINITION to a
          # DIFFERENT Cloudflare account, and $DOMAIN is what the Access app is created
          # for, what the pre-flight gate check and the post-deploy verify probe, and
          # therefore what a 200 makes this workflow roll back or DELETE a project over.
          # Guessing a directory was already ruled out for being silently wrong (#228);
          # guessing a domain can aim a delete at somebody else's site.
          #
          # Same conflation #171 fixed for the audio Release lookup above, same remedy:
          # take the status and the body SEPARATELY. --fail is NOT the fix (see the
          # note at that lookup) — it makes 401 and 404 both non-zero, collapsing the
          # distinction again, and it discards the body, which is where Cloudflare's
          # own `message` lives.
          #
          # Sets PAGES_SUBDOMAIN to the real subdomain, or to '' when Cloudflare says
          # 404 — the ONLY answer that licenses a guess. Returns non-zero on anything
          # else, including an empty status from a curl failure or timeout.
          #
          # It checks curl's exit status ITSELF rather than leaning on `set -e`: the
          # four callers differ in their shell options, and the two that used to pipe
          # curl straight into jq hid an HTTP failure completely (jq exits 0 on an
          # error body) while a transport failure aborted the step under `pipefail`
          # with nothing but curl's own stderr line — no annotation, no diagnosis.
          PAGES_SUBDOMAIN=""
          resolve_pages_subdomain() {
            local body code msg
            body="$(mktemp)"
            code=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                     --max-time 30 -o "$body" -w '%{http_code}' \
                     "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}") || code=''
            case "${code:-}" in
              404) PAGES_SUBDOMAIN=""; rm -f "$body"; return 0 ;;
              2??) ;;
              *)
                # Cloudflare's own diagnosis, never the token (the preflight above
                # deliberately prints only its length). Absent on a transport failure.
                msg=$(jq -r '.errors[0].message // empty' <"$body" 2>/dev/null || echo '')
                rm -f "$body"
                echo "::error::Couldn't read the Cloudflare Pages project '${PROJECT_NAME}' (HTTP ${code:-none — curl failed or timed out}${msg:+ — ${msg}}). This is NOT 'the project doesn't exist yet': refusing to guess ${PROJECT_NAME}.pages.dev, because that domain decides which site gets the Access gate and which site the post-deploy check may roll back or delete. Check the API token has 'Cloudflare Pages: Read' on account ${CLOUDFLARE_ACCOUNT_ID}, then re-run."
                return 1
                ;;
            esac
            PAGES_SUBDOMAIN=$(jq -r '.result.subdomain // empty' <"$body" 2>/dev/null || echo '')
            rm -f "$body"
            if [ -z "$PAGES_SUBDOMAIN" ]; then
              echo "::error::Cloudflare answered HTTP ${code} for Pages project '${PROJECT_NAME}' but the body carries no .result.subdomain. A malformed 200 is not an absent project — refusing to guess a domain. Re-run; if it persists, this is a Cloudflare API fault."
              return 1
            fi
            return 0
          }

          resolve_pages_subdomain || exit 1
          # Whether the project EXISTS, as distinct from whether we could look. The
          # 12130 branch below needs the difference.
          PROJECT_EXISTS=true
          DOMAIN="$PAGES_SUBDOMAIN"
          if [ -z "$DOMAIN" ]; then
            PROJECT_EXISTS=false
            DOMAIN="${PROJECT_NAME}.pages.dev"
            echo "Project not created yet — using name-based domain ${DOMAIN} for now."
          elif [ "$DOMAIN" != "${PROJECT_NAME}.pages.dev" ]; then
            echo "::warning::pages.dev name collision: this project's real domain is ${DOMAIN}, not ${PROJECT_NAME}.pages.dev (the plain name is taken by another Cloudflare account). Protecting the real domain. To get the clean URL, delete this Pages project and redeploy once the plain name is free."
          fi
          BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/access"

          echo "Access domain resolved to ${DOMAIN}"
          echo "domain=${DOMAIN}" >> "$GITHUB_OUTPUT"

          # Find existing Access app (paginate through all pages)
          APP_ID=""
          PAGE=1
          while true; do
            LIST_RESPONSE=$(curl -s "${BASE}/apps?page=${PAGE}&per_page=50" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
            LIST_SUCCESS=$(echo "$LIST_RESPONSE" | jq -r '.success // false')
            if [ "$LIST_SUCCESS" != "true" ]; then
              echo "::error::Failed to list Access apps: $(echo "$LIST_RESPONSE" | jq -r '.errors[0].message // "unknown"')"
              echo "$LIST_RESPONSE" >&2
              exit 1
            fi
            MATCH=$(echo "$LIST_RESPONSE" | \
              jq -r --arg d "$DOMAIN" \
                '(.result // [])[] | select(((.self_hosted_domains // []) | index($d)) or ((.destinations // []) | map(.uri) | index($d)) or (.domain == $d)) | .id' | head -1)
            if [ -n "$MATCH" ]; then
              APP_ID="$MATCH"
              break
            fi
            COUNT=$(echo "$LIST_RESPONSE" | jq -r '(.result // []) | length')
            TOTAL_PAGES=$(echo "$LIST_RESPONSE" | jq -r '.result_info.total_pages // 1')
            echo "Page ${PAGE}/${TOTAL_PAGES}: ${COUNT} apps, no match for ${DOMAIN}"
            if [ "$PAGE" -ge "$TOTAL_PAGES" ] || [ "$COUNT" = "0" ]; then
              break
            fi
            PAGE=$((PAGE + 1))
          done

          if [ -n "$APP_ID" ]; then
            echo "Found existing Access app: $APP_ID"
            # Back-fill the preview wildcard onto apps created before it was
            # added to the create payload — otherwise every pre-existing KB
            # keeps the `hash.<name>.pages.dev` bypass open. PUT (not PATCH:
            # API tokens get 10405 on PATCH) and it preserves attached
            # policies. Non-fatal: the apex gate is already up.
            APP_JSON=$(printf '%s' "$LIST_RESPONSE" | jq -c --arg id "$APP_ID" 'first((.result // [])[] | select(.id == $id))')
            HAS_WILDCARD=$(printf '%s' "$APP_JSON" | jq -r --arg w "*.${DOMAIN}" \
              'if (((.self_hosted_domains // []) | index($w)) or ((.destinations // []) | map(.uri) | index($w))) then "yes" else "" end')
            if [ -z "$HAS_WILDCARD" ]; then
              PUT_BODY=$(printf '%s' "$APP_JSON" | jq -c --arg w "*.${DOMAIN}" \
                '{name, domain, type, session_duration, self_hosted_domains: ((.self_hosted_domains // [.domain]) + [$w])} | with_entries(select(.value != null))')
              PUT_RESP=$(curl -s -X PUT "${BASE}/apps/${APP_ID}" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" -d "$PUT_BODY")
              if [ "$(printf '%s' "$PUT_RESP" | jq -r '.success // false')" = "true" ]; then
                echo "Back-filled *.${DOMAIN} onto Access app ${APP_ID} (preview URLs now gated)."
              else
                echo "::warning::Couldn't add *.${DOMAIN} to Access app ${APP_ID}: $(printf '%s' "$PUT_RESP" | jq -rc '.errors // .'). Preview URLs may be ungated."
              fi
            fi
            echo "app_id=${APP_ID}" >> "$GITHUB_OUTPUT"
            echo "access_ready=true" >> "$GITHUB_OUTPUT"
          else
            # Try to create — will fail on first deploy (Pages project doesn't exist yet)
            CREATE_RESPONSE=$(curl -s -X POST "${BASE}/apps" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{
                \"name\":\"${PROJECT_NAME}\",
                \"domain\":\"${DOMAIN}\",
                \"self_hosted_domains\":[\"${DOMAIN}\",\"*.${DOMAIN}\"],
                \"type\":\"self_hosted\",
                \"session_duration\":\"24h\"
              }")
            APP_ID=$(echo "$CREATE_RESPONSE" | jq -r '.result.id // empty')

            if [ -n "$APP_ID" ]; then
              echo "Created Access app: $APP_ID"
              echo "app_id=${APP_ID}" >> "$GITHUB_OUTPUT"
              echo "access_ready=true" >> "$GITHUB_OUTPUT"
            else
              ERROR=$(echo "$CREATE_RESPONSE" | jq -r '.errors[0].message // "unknown"')
              # 12130 "domain does not belong to zone" was reported as "Pages project
              # does not exist yet" — a second conflation, of "we may not touch that
              # domain" with "the project isn't there" (#239). The resolver above now
              # KNOWS which it is, so the two separate:
              #
              #   PROJECT_EXISTS=false — Cloudflare told us 404. Access cannot bind an
              #   app to a pages.dev domain that no project serves yet, so this is the
              #   ordinary first deploy: defer to the post-deploy step, exactly as
              #   before. Making 12130 unconditionally fatal would break every new KB.
              #
              #   PROJECT_EXISTS=true — the domain is real and this account still may
              #   not have it: a global name collision, or the KB wired to the wrong
              #   Cloudflare account. No retry fixes either, and carrying on means
              #   access_ready=false, which SKIPS the policy sync AND the pre-flight
              #   gate check and publishes ungated. Fail, naming the domain and the
              #   account — the same verdict the first-deploy step already reaches for
              #   12130 three hundred lines below.
              if echo "$ERROR" | grep -q "internal_server_error"; then
                echo "::warning::Cloudflare returned a transient internal error creating the Access app for ${DOMAIN} — deferring to the post-deploy step, which retries."
                echo "access_ready=false" >> "$GITHUB_OUTPUT"
              elif echo "$ERROR" | grep -q "domain does not belong to zone"; then
                if [ "$PROJECT_EXISTS" = "false" ]; then
                  echo "::warning::Pages project does not exist yet — Access app will be created after first deploy."
                  echo "access_ready=false" >> "$GITHUB_OUTPUT"
                else
                  echo "::error::Cloudflare says ${DOMAIN} does not belong to account ${CLOUDFLARE_ACCOUNT_ID} (Access error 12130) — but the Pages project '${PROJECT_NAME}' EXISTS and is served at that domain. That is a global pages.dev name collision, or this KB is wired to the wrong Cloudflare account; retrying cannot fix either. Fix: delete this Pages project and redeploy once the plain name is free, or reconnect the KB to the account that owns the domain. Refusing to continue — an ungated deploy would skip both the policy sync and the pre-flight gate check."
                  echo "$CREATE_RESPONSE" >&2; exit 1
                fi
              else
                echo "::error::Failed to create Access app: $ERROR"
                echo "$CREATE_RESPONSE" >&2; exit 1
              fi
            fi
          fi

      # ── 1a-public. Public mode: resolve domain, remove any leftover gate ──
      # `public: true` is the caller's explicit declaration that this KB is
      # world-readable. An Access app already gating the domain (e.g. the KB
      # used to be private) would silently defeat that, so it is deleted —
      # loudly. Best-effort: without the Access scope on the token we can only
      # warn (the post-deploy reachability check below still catches a site
      # that stayed gated).
      - name: Public mode — resolve domain, drop any Access gate
        id: public-mode
        if: ${{ inputs.public }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "::notice::PUBLIC MODE — this KB deploys with NO Cloudflare Access gate (explicit 'public: true')."
          # The Pages-project resolver — canonical copy and the full rationale are in
          # the 'Ensure Cloudflare Access app' step above (#239). Duplicated rather
          # than shared because the steps of a reusable workflow share no shell, and
          # the shared-script checkout (_playbook) is not part of this release set.
          PAGES_SUBDOMAIN=""
          resolve_pages_subdomain() {
            local body code msg
            body="$(mktemp)"
            code=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                     --max-time 30 -o "$body" -w '%{http_code}' \
                     "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}") || code=''
            case "${code:-}" in
              404) PAGES_SUBDOMAIN=""; rm -f "$body"; return 0 ;;
              2??) ;;
              *)
                msg=$(jq -r '.errors[0].message // empty' <"$body" 2>/dev/null || echo '')
                rm -f "$body"
                echo "::error::Couldn't read the Cloudflare Pages project '${PROJECT_NAME}' (HTTP ${code:-none — curl failed or timed out}${msg:+ — ${msg}}). This is NOT 'the project doesn't exist yet': refusing to guess ${PROJECT_NAME}.pages.dev, because that domain decides which site gets the Access gate and which site the post-deploy check may roll back or delete. Check the API token has 'Cloudflare Pages: Read' on account ${CLOUDFLARE_ACCOUNT_ID}, then re-run."
                return 1
                ;;
            esac
            PAGES_SUBDOMAIN=$(jq -r '.result.subdomain // empty' <"$body" 2>/dev/null || echo '')
            rm -f "$body"
            if [ -z "$PAGES_SUBDOMAIN" ]; then
              echo "::error::Cloudflare answered HTTP ${code} for Pages project '${PROJECT_NAME}' but the body carries no .result.subdomain. A malformed 200 is not an absent project — refusing to guess a domain. Re-run; if it persists, this is a Cloudflare API fault."
              return 1
            fi
            return 0
          }

          resolve_pages_subdomain || exit 1
          DOMAIN="$PAGES_SUBDOMAIN"
          if [ -z "$DOMAIN" ]; then
            DOMAIN="${PROJECT_NAME}.pages.dev"
            echo "Project not created yet — using name-based domain ${DOMAIN} for now."
          fi
          echo "domain=${DOMAIN}" >> "$GITHUB_OUTPUT"

          BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/access"
          PAGE=1
          while true; do
            LIST_RESPONSE=$(curl -s "${BASE}/apps?page=${PAGE}&per_page=50" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
            if [ "$(echo "$LIST_RESPONSE" | jq -r '.success // false')" != "true" ]; then
              echo "::warning::Couldn't list Access apps (token may lack the Access scope) — skipping gate removal. If the site stays gated, remove the Access app for ${DOMAIN} manually."
              break
            fi
            MATCH=$(echo "$LIST_RESPONSE" | \
              jq -r --arg d "$DOMAIN" \
                '(.result // [])[] | select(((.self_hosted_domains // []) | index($d)) or ((.destinations // []) | map(.uri) | index($d)) or (.domain == $d)) | .id' | head -1)
            if [ -n "$MATCH" ]; then
              echo "::warning::Removing existing Access app ${MATCH} gating ${DOMAIN} — this KB is now PUBLIC by explicit opt-in."
              DEL=$(curl -s -X DELETE "${BASE}/apps/${MATCH}" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
              if [ "$(echo "$DEL" | jq -r '.success // false')" != "true" ]; then
                echo "::warning::Failed to delete Access app ${MATCH}: $(echo "$DEL" | jq -r '.errors[0].message // "unknown"'). The post-deploy check will fail if the site stays gated."
              fi
              break
            fi
            TOTAL_PAGES=$(echo "$LIST_RESPONSE" | jq -r '.result_info.total_pages // 1')
            COUNT=$(echo "$LIST_RESPONSE" | jq -r '(.result // []) | length')
            if [ "$PAGE" -ge "$TOTAL_PAGES" ] || [ "$COUNT" = "0" ]; then
              echo "No Access app gates ${DOMAIN} — nothing to remove."
              break
            fi
            PAGE=$((PAGE + 1))
          done

      # ── 1b. Merge allowed-emails + client-emails ──
      - name: Merge email lists
        id: emails
        # SECURITY: the email inputs are attacker-influenceable (admin-supplied,
        # or set directly as CLIENT_EMAILS by anyone with repo write). They reach
        # the shell ONLY through env vars — never inlined as ${{ }} in run: —
        # because bash does not re-evaluate a variable's contents, so a crafted
        # value like `x@e.com"; curl evil #` cannot inject commands into this
        # runner (which later holds the Cloudflare API token).
        env:
          ALLOWED_EMAILS: ${{ inputs.allowed-emails }}
          CLIENT_EMAILS: ${{ inputs.client-emails }}
        run: |
          ALL="$ALLOWED_EMAILS"
          [ -n "$CLIENT_EMAILS" ] && ALL="${ALL:+$ALL,}$CLIENT_EMAILS"
          echo "merged=$ALL" >> "$GITHUB_OUTPUT"

      # ── 1c. Sync managed Access policies (allow + optional bypass) ──
      - name: Sync Access policies
        if: steps.access.outputs.access_ready == 'true'
        uses: Glassdocs/publisher/.github/actions/sync-access-policies@v1
        with:
          app-id: ${{ steps.access.outputs.app_id }}
          cf-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cf-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          email-domain: ${{ inputs.email-domain }}
          client-emails: ${{ steps.emails.outputs.merged }}
          client-domain: ${{ inputs.client-domain }}
          office-cidrs: ${{ vars.OFFICE_CIDRS }}

      # ── 2. Pre-flight: confirm Access is gating the domain ──
      - name: Pre-flight — verify Access is active
        if: steps.access.outputs.access_ready == 'true'
        env:
          DOMAIN: ${{ steps.access.outputs.domain }}
        run: |
          set -euo pipefail
          # A 200 may be Access-policy propagation lag rather than a truly open
          # site — retry like the post-deploy check does, and only conclude
          # BLOCKED if the FINAL attempt still serves content.
          HTTP_STATUS="000"
          for attempt in 1 2 3 4; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 15 "https://${DOMAIN}" 2>/dev/null || echo "000")
            echo "Pre-flight attempt ${attempt}/4: https://${DOMAIN} returned HTTP ${HTTP_STATUS}"
            if [ "$HTTP_STATUS" != "200" ]; then
              break
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "Got 200 — could be Access propagation lag; retrying in 10s..."
              sleep 10
            fi
          done

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "::error::BLOCKED — site is publicly accessible BEFORE deploy. Access is not active."
            echo "::error::Check Cloudflare Zero Trust → Access → Applications for ${DOMAIN}"
            exit 1
          fi

          # 302/303 = Access login redirect (good)
          # 000     = site doesn't exist yet (first deploy — safe)
          # 4xx/5xx = site is down (safe to proceed)
          if [ "$HTTP_STATUS" = "000" ]; then
            echo "First deploy — site does not exist yet. Access app is pre-configured."
          else
            echo "Access is active (HTTP ${HTTP_STATUS})"
          fi

      # ── 3. Ensure the Pages project exists AND is a DIRECT-UPLOAD project ──
      # Runs every deploy. On first deploy it CREATES the project (direct upload);
      # on every deploy it verifies the project isn't a Cloudflare "Connect to Git"
      # project (those only accept Cloudflare-side builds, so `wrangler pages
      # deploy` fails on them). Both checks matter because the downstream deploy
      # step's own errors are opaque: a Git-connected project surfaces as "No
      # migration path exists", and a project that failed to create surfaces as the
      # misleading "The Pages project ... does not exist". We resolve both here and
      # print an actionable message instead. Project creation is done via the API
      # (not `wrangler ... || true`) so a transient Cloudflare error (code 8000000)
      # is RETRIED, and a persistent failure hard-fails with the real error rather
      # than being swallowed and mis-surfaced two steps later.
      - name: Ensure Pages project (direct-upload)
        id: ensure-project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Did THIS run bring the project into existence? The post-deploy check
          # may delete the project when it proves the site is exposed, and that
          # is only defensible for a project we just created — deleting a
          # customer's pre-existing site over a check failure is not a recovery,
          # it is the outage. Recorded here because this is the only step that
          # KNOWS; inferring it downstream from `access_ready` was wrong (that
          # flag also goes false on a transient Cloudflare 500).
          created_here=false
          BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          RESP=$(curl -s -w $'\n%{http_code}' "${BASE}/${PROJECT_NAME}" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          CODE=$(printf '%s' "$RESP" | tail -n1)
          BODY=$(printf '%s' "$RESP" | sed '$d')
          if [ "$CODE" = "200" ]; then
            SOURCE=$(printf '%s' "$BODY" | jq -r '.result.source.type // empty')
            if [ -n "$SOURCE" ]; then
              echo "::error::Cloudflare Pages project '${PROJECT_NAME}' is connected to Git (${SOURCE}) in the Cloudflare dashboard. Glassdocs publishes by DIRECT UPLOAD from GitHub Actions and cannot deploy to a Git-connected project. Fix: Cloudflare dashboard → Workers & Pages → ${PROJECT_NAME} → Settings → Delete project, then redeploy — Glassdocs recreates it correctly. Do NOT use 'Connect to Git' for a Glassdocs KB; publishing is driven entirely from this workflow."
              exit 1
            fi
            echo "Pages project '${PROJECT_NAME}' exists (direct-upload) — OK."
          elif [ "$CODE" = "404" ]; then
            echo "Creating direct-upload Pages project '${PROJECT_NAME}'..."
            created=false
            for attempt in 1 2 3; do
              CR=$(curl -s -w $'\n%{http_code}' -X POST "$BASE" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" \
                --data "{\"name\":\"${PROJECT_NAME}\",\"production_branch\":\"main\"}")
              CRCODE=$(printf '%s' "$CR" | tail -n1)
              CRBODY=$(printf '%s' "$CR" | sed '$d')
              ERRS=$(printf '%s' "$CRBODY" | jq -c '.errors' 2>/dev/null || printf '%s' "$CRBODY")
              if [ "$CRCODE" = "200" ]; then created=true; created_here=true; echo "Created '${PROJECT_NAME}'."; break; fi
              # A concurrent run may have created it first — treat "name taken" as
              # success, but NOT as ours: deleting it would destroy that run's project.
              if printf '%s' "$CRBODY" | grep -qi 'already exists\|not unique\|8000009'; then
                created=true; echo "Project '${PROJECT_NAME}' already exists — continuing."; break
              fi
              echo "::warning::Create attempt ${attempt}/3 failed (HTTP ${CRCODE}): ${ERRS}. Retrying in 5s..."
              sleep 5
            done
            if [ "$created" != "true" ]; then
              echo "::error::Couldn't create Cloudflare Pages project '${PROJECT_NAME}' after 3 attempts (last: ${ERRS}). Cloudflare error 8000000 is usually a transient API blip — just re-run this deploy. If it persists: check the token has 'Cloudflare Pages: Edit' and that the account it belongs to matches CLOUDFLARE_ACCOUNT_ID (re-create the token from the Glassdocs 'Connect Cloudflare' deep link to fix both)."
              exit 1
            fi
          else
            echo "::warning::Couldn't verify the Pages project (HTTP ${CODE}); continuing. If the deploy fails with 'existing projects cannot be upgraded', the project is Git-connected — delete it in the Cloudflare dashboard and redeploy."
          fi
          # Unknown ownership stays false — the delete below must never fire on a
          # guess. A missed delete leaves a job that failed loudly; a wrong one
          # destroys a customer's live site.
          echo "created=${created_here}" >> "$GITHUB_OUTPUT"

      # ── 4. Deploy the built site to Cloudflare Pages ──
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ inputs.wrangler-version || '' }}
          # Force npm (always on the runner). Without this, wrangler-action infers
          # the package manager from a lockfile in the KB repo — so a repo that
          # carries a pnpm-lock.yaml / yarn.lock (e.g. an app repo published as a
          # KB) makes it try pnpm/yarn, which isn't installed → "Unable to locate
          # executable file: pnpm". The KB's own lockfile is irrelevant to running
          # wrangler; pin npm so ANY repo deploys.
          packageManager: npm
          command: pages deploy ${{ env.SITE_DIR }} --project-name=${{ inputs.project-name }}

      # ── 5. First deploy: create Access app now that Pages project exists ──
      - name: Create Access app (first deploy)
        id: access-firstdeploy
        if: steps.access.outputs.access_ready == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOMAIN: ${{ steps.access.outputs.domain }}
        run: |
          set -euo pipefail
          BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/access"

          # On a TRUE first deploy the earlier step used the name-based domain because
          # the project didn't exist yet. Now it does — re-read its ACTUAL subdomain,
          # which is what the site is really served at (Cloudflare may have assigned a
          # collision suffix, e.g. <name>-xyz.pages.dev). Protecting anything else
          # yields Access error 12130 forever.
          #
          # This was the weakest of the four lookups and the one nearest the damage:
          # it piped curl straight into jq, so an HTTP 401/403/5xx produced an empty
          # $REAL (jq exits 0 on an error body), `[ -n "$REAL" ] && DOMAIN="$REAL"`
          # silently kept the earlier GUESS, and that guess became `real_domain` —
          # the domain the post-deploy verify probes and the rollback/delete acts on
          # (#239). The resolver below refuses to guess instead.
          #
          # Canonical copy and the full rationale are in 'Ensure Cloudflare Access
          # app' above. Duplicated because the steps of a reusable workflow share no
          # shell.
          PAGES_SUBDOMAIN=""
          resolve_pages_subdomain() {
            local body code msg
            body="$(mktemp)"
            code=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                     --max-time 30 -o "$body" -w '%{http_code}' \
                     "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}") || code=''
            case "${code:-}" in
              404) PAGES_SUBDOMAIN=""; rm -f "$body"; return 0 ;;
              2??) ;;
              *)
                msg=$(jq -r '.errors[0].message // empty' <"$body" 2>/dev/null || echo '')
                rm -f "$body"
                echo "::error::Couldn't read the Cloudflare Pages project '${PROJECT_NAME}' (HTTP ${code:-none — curl failed or timed out}${msg:+ — ${msg}}). This is NOT 'the project doesn't exist yet': refusing to guess ${PROJECT_NAME}.pages.dev, because that domain decides which site gets the Access gate and which site the post-deploy check may roll back or delete. Check the API token has 'Cloudflare Pages: Read' on account ${CLOUDFLARE_ACCOUNT_ID}, then re-run."
                return 1
                ;;
            esac
            PAGES_SUBDOMAIN=$(jq -r '.result.subdomain // empty' <"$body" 2>/dev/null || echo '')
            rm -f "$body"
            if [ -z "$PAGES_SUBDOMAIN" ]; then
              echo "::error::Cloudflare answered HTTP ${code} for Pages project '${PROJECT_NAME}' but the body carries no .result.subdomain. A malformed 200 is not an absent project — refusing to guess a domain. Re-run; if it persists, this is a Cloudflare API fault."
              return 1
            fi
            return 0
          }

          resolve_pages_subdomain || exit 1
          # A 404 here means the project STILL isn't there after a deploy — keep the
          # inherited name-based domain and let the create below report the truth.
          if [ -n "$PAGES_SUBDOMAIN" ]; then DOMAIN="$PAGES_SUBDOMAIN"; fi
          # Export the REAL subdomain IMMEDIATELY — before any create attempt —
          # so the post-deploy verify/rollback probes the domain the site is
          # actually served at even when Access-app creation fails below. The
          # stale name-based domain, on a collision, belongs to a DIFFERENT
          # account (verifying it would either green-light an unprotected site
          # or roll back this good deployment).
          echo "real_domain=${DOMAIN}" >> "$GITHUB_OUTPUT"
          echo "Pages project now exists. Creating Access app for ${DOMAIN}..."

          # Create with a SHORT retry for genuine transient 5xx only. 12130
          # "domain does not belong to zone" here is NOT transient: with the real
          # subdomain it means this Cloudflare account doesn't own the domain (a
          # global name collision / the KB is wired to the wrong account) — retrying
          # can never fix it, so fail fast with an actionable message.
          APP_ID=""; LAST=""
          for attempt in 1 2 3; do
            LAST=$(curl -s -X POST "${BASE}/apps" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"${PROJECT_NAME}\",\"domain\":\"${DOMAIN}\",\"self_hosted_domains\":[\"${DOMAIN}\",\"*.${DOMAIN}\"],\"type\":\"self_hosted\",\"session_duration\":\"24h\"}")
            APP_ID=$(printf '%s' "$LAST" | jq -r '.result.id // empty')
            if [ -n "$APP_ID" ]; then echo "Created Access app on attempt ${attempt}: ${APP_ID}"; break; fi
            CODE=$(printf '%s' "$LAST" | jq -r '.errors[0].code // empty')
            MSG=$(printf '%s' "$LAST" | jq -r '.errors[0].message // "unknown"')
            echo "attempt ${attempt}/3 @ $(date -u +%H:%M:%SZ): code=${CODE} msg=${MSG}"
            if [ "$CODE" = "12130" ]; then
              echo "::error::Cloudflare says ${DOMAIN} does not belong to this account (Access error 12130). The site deployed here, but this account doesn't own that pages.dev domain — usually a global name collision (the plain <name>.pages.dev is taken by another account, so this project got a suffixed domain) or the KB is wired to the wrong Cloudflare account. Fix: delete this Pages project and redeploy once the plain name is free, or reconnect the KB to the account that owns the domain. The post-deploy check will now verify the gate on the real domain and roll this deployment back if it is exposed."
              echo "$LAST" >&2; exit 1
            fi
            sleep 8
          done

          if [ -z "$APP_ID" ]; then
            echo "::error::Couldn't create the Access app for ${DOMAIN} after 3 attempts. Last response below. The post-deploy check will now verify the gate and roll this deployment back if it is exposed; re-run once resolved."
            echo "$LAST" >&2
            exit 1
          fi

          echo "Created Access app: $APP_ID"
          echo "app_id=${APP_ID}" >> "$GITHUB_OUTPUT"

      - name: Sync Access policies (first deploy)
        if: steps.access.outputs.access_ready == 'false'
        uses: Glassdocs/publisher/.github/actions/sync-access-policies@v1
        with:
          app-id: ${{ steps.access-firstdeploy.outputs.app_id }}
          cf-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cf-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          email-domain: ${{ inputs.email-domain }}
          client-emails: ${{ steps.emails.outputs.merged }}
          client-domain: ${{ inputs.client-domain }}
          office-cidrs: ${{ vars.OFFICE_CIDRS }}

      # ── 6. Post-deploy: verify the live site is gated ──
      # Runs whenever a deploy actually happened — INCLUDING when a later step
      # (e.g. Access-app creation) failed and aborted the job. Without this, a
      # failed gate setup would skip verification and leave the freshly deployed,
      # ungated site live. Gated on the deploy step so a build/deploy failure
      # (nothing new published) doesn't trigger a rollback of a prior good deploy.
      - name: Post-deploy — verify site is protected
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && !inputs.public }}
        env:
          # On a first deploy the access step's domain is name-based; prefer the
          # real subdomain the first-deploy step resolved after the project existed.
          DOMAIN: ${{ steps.access-firstdeploy.outputs.real_domain || steps.access.outputs.domain }}
          # Two DIFFERENT questions, deliberately answered by two flags.
          #
          # FIRST_DEPLOY only sizes the propagation window. access_ready=='false'
          # is an approximation of "brand new" (it is really "the pre-deploy
          # Access-app creation failed with 12130 or a 500"), and that is fine
          # here: waiting longer than necessary costs a little CI time.
          FIRST_DEPLOY: ${{ steps.access.outputs.access_ready == 'false' }}
          # PROJECT_CREATED_HERE gates the DELETE, so it must be exact. It comes
          # from the step that actually created the project, not from an
          # inference — access_ready also goes false on a transient Cloudflare
          # 500, and deleting a customer's pre-existing site on the strength of a
          # 500 would turn a failed check into an outage.
          PROJECT_CREATED_HERE: ${{ steps.ensure-project.outputs.created }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          CF="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"

          # FAIL CLOSED, but on EVIDENCE — the three outcomes are not the same
          # thing and used to be collapsed into one (#67):
          #
          #   3xx redirect to the Access login → PROVEN GATED. Pass.
          #   200, content served anonymously  → PROVEN EXPOSED. Destroy it.
          #   522 / 000 / 4xx / 5xx            → NOTHING SERVED to anyone. That
          #     demonstrates no leak and no gate. It is not grounds for a
          #     destructive action; it is grounds for asking the Access API,
          #     which is authoritative and doesn't wait on edge propagation.
          #
          # The old step treated every non-3xx as "roll back", which meant the
          # only case that ever triggered the rollback was the one where there
          # was nothing to roll back — see the deadline note below.
          # The three VERIFY_* overrides are a TEST SEAM: the suite drives every
          # branch of this step verbatim, and would otherwise spend five minutes
          # sleeping per case. Nothing sets them in CI or production — the
          # defaults below are the shipped values.
          BUDGET="${VERIFY_BUDGET_SECONDS:-60}"
          if [ "${FIRST_DEPLOY}" = "true" ]; then
            # A project created seconds ago answers 522 at the edge for minutes.
            # Measured on a real first deploy: created 05:02:56Z, still 522 at
            # 05:04:12Z, serving the Access redirect by ~05:07Z. A 55s window
            # failed that deploy even though the gate was up the whole time.
            BUDGET="${VERIFY_BUDGET_SECONDS:-300}"
            echo "First deploy — allowing up to ${BUDGET}s for the new project to reach the edge."
          fi
          echo "Waiting for deployment to propagate..."
          sleep "${VERIFY_SETTLE_SECONDS:-15}"

          DEADLINE=$(( $(date +%s) + BUDGET ))
          STATUS="000"
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://${DOMAIN}" || echo "000")
            echo "verify attempt ${attempt}: https://${DOMAIN} -> HTTP ${STATUS}"
            case "$STATUS" in
              301|302|303|307|308)
                echo "Gate confirmed — unauthenticated request redirects to Access login (HTTP ${STATUS})."
                exit 0
                ;;
            esac
            # A 200 can still be Access-policy propagation lag (the pre-flight
            # check makes the same allowance), so keep probing to the deadline
            # and judge on the FINAL observation rather than the first.
            [ "$(date +%s)" -ge "$DEADLINE" ] && break
            sleep "${VERIFY_POLL_SECONDS:-10}"
          done

          if [ "$STATUS" = "200" ]; then
            # ── PROVEN EXPOSED ──────────────────────────────────────────────
            # Content was served to an unauthenticated request for the whole
            # window. This is the only branch that destroys anything.
            echo "::error::https://${DOMAIN} SERVED CONTENT to an unauthenticated request (HTTP 200) for ${BUDGET}s — the Access gate is not up. Failing closed."
            PREV=$(curl -s "${CF}/pages/projects/${PROJECT_NAME}/deployments?per_page=10" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              | jq -r '[(.result // [])[] | select(.environment == "production" and (.latest_stage.status // "") == "success")][1].id // empty')
            if [ -n "$PREV" ]; then
              # The deployment to remove IS the active production one, and
              # Cloudflare refuses to DELETE that (code 8000034) even with
              # ?force=true. Rolling production back to the previous good build
              # is the supported way to stop serving it.
              RB=$(curl -s -X POST "${CF}/pages/projects/${PROJECT_NAME}/deployments/${PREV}/rollback" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" || true)
              if [ "$(printf '%s' "$RB" | jq -r '.success // false' 2>/dev/null)" = "true" ]; then
                echo "Rolled production back to ${PREV}. NOTE: if that build is also ungated, the site is still exposed — fix the Access app before redeploying."
              else
                echo "::error::ROLLBACK FAILED — the exposed deployment is STILL LIVE at https://${DOMAIN}. Roll back or delete the project manually NOW (Cloudflare dashboard → Workers & Pages → ${PROJECT_NAME}). Response: $(printf '%s' "$RB" | jq -c '.errors // .' 2>/dev/null || printf '%s' "$RB")"
              fi
            elif [ "${PROJECT_CREATED_HERE}" = "true" ]; then
              # No earlier deployment exists, so there is nothing to roll back
              # to; deleting the project is the only way to stop serving. Safe
              # ONLY because this run created it — the account returns to the
              # state it was in before the deploy. Anything less certain than
              # that takes the branch below and destroys nothing.
              echo "::error::No previous deployment to roll back to, and this run created the project. Deleting it — that restores the account to its prior state."
              DEL=$(curl -s -X DELETE "${CF}/pages/projects/${PROJECT_NAME}" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" || true)
              if [ "$(printf '%s' "$DEL" | jq -r '.success // false' 2>/dev/null)" = "true" ]; then
                echo "Deleted Pages project ${PROJECT_NAME}. Fix the Access configuration, then re-run this deploy to recreate it."
              else
                echo "::error::DELETE FAILED — https://${DOMAIN} is STILL SERVING PRIVATE DOCS PUBLICLY. Delete the project manually NOW (Cloudflare dashboard → Workers & Pages → ${PROJECT_NAME} → Settings → Delete project). Response: $(printf '%s' "$DEL" | jq -c '.errors // .' 2>/dev/null || printf '%s' "$DEL")"
              fi
            else
              echo "::error::No previous successful production deployment to roll back to, and this run did NOT create ${PROJECT_NAME} — so removing it is not Glassdocs' call to make. The exposed site is STILL LIVE: take it down manually NOW (Cloudflare dashboard → Workers & Pages → ${PROJECT_NAME})."
            fi

            # ── Did that actually close the exposure? (#71) ─────────────────
            # "We took an action" is not "the site stopped serving", and
            # reporting the first as if it were the second is the same
            # conflation this step exists to avoid. Two ways it bites: the
            # build we rolled back TO can be ungated as well (swapping one
            # exposed build for another), and the rollback/delete call itself
            # can fail. Re-probe and say which happened. Cheap — the run has
            # already failed; this only decides how loudly.
            sleep "${VERIFY_SETTLE_SECONDS:-10}"
            AFTER="000"
            REDEADLINE=$(( $(date +%s) + ${VERIFY_REPROBE_SECONDS:-30} ))
            while :; do
              AFTER=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://${DOMAIN}" || echo "000")
              echo "post-action probe: https://${DOMAIN} -> HTTP ${AFTER}"
              [ "$AFTER" != "200" ] && break
              [ "$(date +%s)" -ge "$REDEADLINE" ] && break
              sleep "${VERIFY_POLL_SECONDS:-5}"
            done
            if [ "$AFTER" = "200" ]; then
              echo "::error::STILL EXPOSED — https://${DOMAIN} is SERVING CONTENT PUBLICLY right now, after the action above. Either that action failed or the build it fell back to is ungated too. Take the site down by hand IMMEDIATELY: Cloudflare dashboard → Workers & Pages → ${PROJECT_NAME} → Settings → Delete project. Do not redeploy until the Access app for ${DOMAIN} exists with at least one policy."
            else
              echo "Exposure closed — https://${DOMAIN} no longer serves content to an unauthenticated request (HTTP ${AFTER}). The deploy still FAILED: fix the Access configuration for ${DOMAIN} before redeploying."
            fi
            exit 1
          fi

          # ── INCONCLUSIVE ──────────────────────────────────────────────────
          # Nothing was served, so nothing leaked — but nothing proved the gate
          # either. Ask the Access API, which knows the configuration regardless
          # of whether the edge is serving yet.
          echo "No Access redirect observed within ${BUDGET}s (last HTTP ${STATUS}) — nothing was served either, so checking the Access configuration directly."
          APP_ID=""; PAGE=1; LIST_OK=false
          while :; do
            LIST=$(curl -s "${CF}/access/apps?page=${PAGE}&per_page=50" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
            [ "$(printf '%s' "$LIST" | jq -r '.success // false')" = "true" ] || break
            LIST_OK=true
            APP_ID=$(printf '%s' "$LIST" | jq -r --arg d "$DOMAIN" \
              '(.result // [])[] | select(((.self_hosted_domains // []) | index($d)) or ((.destinations // []) | map(.uri) | index($d)) or (.domain == $d)) | .id' | head -1)
            [ -n "$APP_ID" ] && break
            TOTAL_PAGES=$(printf '%s' "$LIST" | jq -r '.result_info.total_pages // 1')
            COUNT=$(printf '%s' "$LIST" | jq -r '(.result // []) | length')
            { [ "$PAGE" -ge "$TOTAL_PAGES" ] || [ "$COUNT" = "0" ]; } && break
            PAGE=$((PAGE + 1))
          done

          POLICIES=0
          if [ -n "$APP_ID" ]; then
            POLICIES=$(curl -s "${CF}/access/apps/${APP_ID}/policies" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              | jq -r '(.result // []) | length' 2>/dev/null || echo 0)
          fi

          if [ -n "$APP_ID" ] && [ "$POLICIES" -gt 0 ]; then
            # An app with at least one policy gates the domain the moment the
            # edge starts serving it. This is the first-deploy case that used to
            # fail a perfectly good deploy and then try to delete it.
            echo "::warning::https://${DOMAIN} didn't answer within ${BUDGET}s (last HTTP ${STATUS}), but Access app ${APP_ID} covers it with ${POLICIES} policy(ies) — the gate IS configured and will apply as soon as the site is reachable. Confirm the site loads once propagation completes."
            exit 0
          fi

          # No gate configured AND nothing served. Don't destroy anything —
          # there is nothing being served to take down, and the next run fixes
          # it — but never let this pass as verified.
          if [ -n "$APP_ID" ]; then
            echo "::error::Access app ${APP_ID} covers ${DOMAIN} but has NO policies — that gate allows no one and proves nothing. Nothing is being served right now (last HTTP ${STATUS}), so the deployment is left in place; fix the policies and re-run before sharing the URL."
          elif [ "$LIST_OK" != "true" ]; then
            # Never report "no gate exists" when what actually happened is "we
            # couldn't look" — the two call for completely different fixes.
            echo "::error::Couldn't read the Access configuration for ${DOMAIN} (the Cloudflare token may lack 'Access: Apps and Policies'), and the site didn't respond (last HTTP ${STATUS}) — so the gate is UNVERIFIED in both directions. The deployment is left in place; re-connect Cloudflare with a correctly scoped token and re-run before sharing the URL."
          else
            echo "::error::No Cloudflare Access app covers ${DOMAIN}, and the site didn't respond (last HTTP ${STATUS}). Nothing is being served yet, so the deployment is left in place — but it will be PUBLIC once it is. Create the Access app (re-run this deploy) and do NOT share the URL until a re-run reports the gate confirmed."
          fi
          exit 1

      # ── 6-public. Post-deploy: verify the PUBLIC site is actually live ──
      # The inverse of the gated check: a public KB must answer an
      # unauthenticated request with content (HTTP 200). A redirect here means
      # an Access gate is still up (removal failed or propagation lag); fail
      # loudly — but do NOT roll back, since a still-gated site is the safe
      # direction of failure for a public KB.
      - name: Post-deploy — verify public site is live
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && inputs.public }}
        env:
          # A first PUBLIC deploy races edge propagation exactly like the gated
          # one (#67) — the project won't answer for minutes, and a 4-attempt
          # window failed the deploy before the site ever had a chance to serve.
          #
          # Deliberately NOT the gated step's `steps.access.outputs.access_ready`
          # expression (#156). That step is `if: ${{ !inputs.public }}`, and this
          # one only runs when `inputs.public` is true — mutually exclusive, so
          # access_ready read as '' here, `'' == 'false'` was false, and the 300s
          # branch below was unreachable for every public KB ever published.
          # `ensure-project` runs in BOTH modes and is the only step that knows.
          FIRST_DEPLOY: ${{ steps.ensure-project.outputs.created == 'true' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Re-resolve the REAL subdomain now that the project certainly exists
          # (on a first deploy the pre-deploy step only had the name-based guess).
          # This step decides which site a 200 is read off and reported live, so a
          # failed lookup must not fall back to a guess: on a collision the guess is
          # another account's site, and "it answered 200" would be a claim about
          # somebody else's KB (#239). Canonical resolver: 'Ensure Cloudflare Access
          # app' above.
          PAGES_SUBDOMAIN=""
          resolve_pages_subdomain() {
            local body code msg
            body="$(mktemp)"
            code=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                     --max-time 30 -o "$body" -w '%{http_code}' \
                     "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}") || code=''
            case "${code:-}" in
              404) PAGES_SUBDOMAIN=""; rm -f "$body"; return 0 ;;
              2??) ;;
              *)
                msg=$(jq -r '.errors[0].message // empty' <"$body" 2>/dev/null || echo '')
                rm -f "$body"
                echo "::error::Couldn't read the Cloudflare Pages project '${PROJECT_NAME}' (HTTP ${code:-none — curl failed or timed out}${msg:+ — ${msg}}). This is NOT 'the project doesn't exist yet': refusing to guess ${PROJECT_NAME}.pages.dev, because that domain decides which site gets the Access gate and which site the post-deploy check may roll back or delete. Check the API token has 'Cloudflare Pages: Read' on account ${CLOUDFLARE_ACCOUNT_ID}, then re-run."
                return 1
                ;;
            esac
            PAGES_SUBDOMAIN=$(jq -r '.result.subdomain // empty' <"$body" 2>/dev/null || echo '')
            rm -f "$body"
            if [ -z "$PAGES_SUBDOMAIN" ]; then
              echo "::error::Cloudflare answered HTTP ${code} for Pages project '${PROJECT_NAME}' but the body carries no .result.subdomain. A malformed 200 is not an absent project — refusing to guess a domain. Re-run; if it persists, this is a Cloudflare API fault."
              return 1
            fi
            return 0
          }

          resolve_pages_subdomain || exit 1
          DOMAIN="$PAGES_SUBDOMAIN"
          if [ -z "$DOMAIN" ]; then DOMAIN="${PROJECT_NAME}.pages.dev"; fi
          # Same test seam as the gated check above; defaults are the shipped values.
          BUDGET="${VERIFY_BUDGET_SECONDS:-60}"
          if [ "${FIRST_DEPLOY}" = "true" ]; then
            BUDGET="${VERIFY_BUDGET_SECONDS:-300}"
            echo "First deploy — allowing up to ${BUDGET}s for the new project to reach the edge."
          fi
          echo "Waiting for deployment to propagate..."
          sleep "${VERIFY_SETTLE_SECONDS:-15}"
          DEADLINE=$(( $(date +%s) + BUDGET ))
          STATUS="000"
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://${DOMAIN}" || echo "000")
            echo "verify attempt ${attempt}: https://${DOMAIN} -> HTTP ${STATUS}"
            if [ "$STATUS" = "200" ]; then
              echo "Public site is live: https://${DOMAIN}"
              exit 0
            fi
            [ "$(date +%s)" -ge "$DEADLINE" ] && break
            sleep "${VERIFY_POLL_SECONDS:-10}"
          done
          case "$STATUS" in
            301|302|303|307|308)
              echo "::error::https://${DOMAIN} still redirects (HTTP ${STATUS}) — an Access gate is still up despite 'public: true'. Remove the Access app for ${DOMAIN} in Cloudflare Zero Trust and re-run. Deployment left in place (gated is the safe failure direction)." ;;
            *)
              echo "::error::https://${DOMAIN} is not serving content (last HTTP ${STATUS}). Deployment left in place — re-run once resolved." ;;
          esac
          exit 1
