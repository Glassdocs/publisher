<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Glassdocs">
  <title>Glassdocs</title>
  <!-- Glassdocs mark: a glass tile with a document cut into it. Transparency
       (glass) + a page (docs) = "software you can actually see." Mint gradient
       on the brand accent so it pops at 16px on a tab and 512px on a card. -->
  <defs>
    <linearGradient id="gd-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0bf5c3"/>
      <stop offset="1" stop-color="#06b489"/>
    </linearGradient>
    <clipPath id="gd-clip"><rect width="32" height="32" rx="7"/></clipPath>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#gd-tile)"/>
  <!-- page (negative space in the tile) with a folded top-right corner -->
  <path d="M11 7.5 H18 L21.5 11 V23 A1.5 1.5 0 0 1 20 24.5 H11 A1.5 1.5 0 0 1 9.5 23 V9 A1.5 1.5 0 0 1 11 7.5 Z" fill="#0b0d13"/>
  <path d="M18 7.5 V11 H21.5 Z" fill="#0b0d13" opacity="0.5"/>
  <!-- lines of text on the page, in the accent -->
  <rect x="12" y="13" width="7" height="1.6" rx="0.8" fill="#0bf5c3"/>
  <rect x="12" y="16.6" width="7" height="1.6" rx="0.8" fill="#0bf5c3" opacity="0.72"/>
  <rect x="12" y="20.2" width="4.6" height="1.6" rx="0.8" fill="#0bf5c3" opacity="0.5"/>
  <!-- glass glint -->
  <path d="M-2 9 L11 -3 H17 L-2 17 Z" fill="#ffffff" opacity="0.14" clip-path="url(#gd-clip)"/>
</svg>
